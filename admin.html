<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KREO Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

/* ============================================================
   QUEST — tokens
   Palette + type taken from the brief's colour scheme board.
   Orange is a signal colour: graphics and large type only.
   ============================================================ */
:root{
  --ink:#0F0E0C; --ink-2:#2A2723; --paper:#FFFFFF; --surface:#FFF;
  --line:#E4DFD5; --grey:#6B665E; --grey-2:#8E8880;
  /* Signal lime. Luminance .78 — it is a FILL, never text on light.
     --on-brand is the label colour that sits on a lime fill;
     --brand-ink is the readable-as-text role. Both are roles,
     not shades, so dark mode can invert them independently. */
  --brand:#C7F464;      /* fill · ink label reads 15.21 on it */
  --on-brand:#0F0E0C;   /* label colour ON a brand fill */
  --brand-ink:#4A630D;  /* 6.42 on paper — lime as readable text */
  --brand-soft:#F4FBDE; --brand-edge:#6E9314; --live:#C0180A; --good:#0E7A4F;
  /* Hero sits on lime in both themes, so its text colours are fixed
     rather than theme-derived — cream ink on lime would vanish. */
  --hero-ink:#14401F; --hero-accent:#0A2A12; --hero-btn:#14401F;
  --close-end:#D9F58C; --close-sub:#3F5F45;
  --trail-c:#6E9314;

  --f-display:'Archivo',system-ui,sans-serif;
  --f:'Archivo',system-ui,-apple-system,sans-serif;
  --m:'IBM Plex Mono',ui-monospace,monospace;

  --t-2xs:11px; --t-xs:12px; --t-sm:14px; --t-base:16px;
  --t-lg:19px; --t-xl:23px; --t-2xl:30px; --t-3xl:42px; --t-4xl:56px;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --s6:32px; --s7:48px; --s8:64px;

  --r1:6px; --r2:14px; --r3:20px; --pill:999px;
  --sh:0 1px 2px rgba(15,14,12,.05),0 10px 30px -18px rgba(15,14,12,.25);
  /* Button lift. Four values, scaled to weight: a quiet button that
     casts the same shadow as a primary is no longer quiet. */
  --btn-sh:0 1px 2px rgba(15,14,12,.08),0 2px 6px -1px rgba(15,14,12,.14);
  --btn-sh-h:0 2px 4px rgba(15,14,12,.10),0 8px 18px -4px rgba(15,14,12,.22);
  --btn-sh-a:0 1px 1px rgba(15,14,12,.14);
  --btn-sh-soft:0 1px 2px rgba(15,14,12,.06);
  --scrim:rgba(255,255,255,.88);   /* sticky bars */
  --scrim-2:rgba(255,255,255,.94);
  --on-media:#FAF8F4;              /* text over photos — never flips */
  --ok-bg:#F2FAF6;
  --ez:cubic-bezier(.2,.7,.3,1);
}

/* Dark. ink/paper are a *pair* — flipping both keeps every
   ink-on-paper component correct without touching a component.
   brand-ink lightens: it is the readable-brand role, not a hue. */
[data-theme=dark]{
  --ink:#F4F1EB; --ink-2:#DCD6CB; --paper:#0D0C0B; --surface:#171614;
  --line:#2E2B26; --grey:#9C968C; --grey-2:#8E887C;
  --trail-c:#C7F464;
  --close-end:#AFDD5C; --close-sub:#2F4A18;
  --brand:#C7F464; --on-brand:#0F0E0C; --brand-ink:#C7F464;
  --brand-soft:#242D12; --brand-edge:#C7F464;
  --live:#FF4B33; --good:#3FBF87;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8);
  /* On near-black a cast shadow is invisible, so depth comes from a
     rim highlight above plus a deeper shadow below. */
  --btn-sh:0 1px 0 rgba(255,255,255,.08) inset,0 2px 8px -2px rgba(0,0,0,.75);
  --btn-sh-h:0 1px 0 rgba(255,255,255,.12) inset,0 10px 22px -6px rgba(0,0,0,.9);
  --btn-sh-a:0 1px 2px rgba(0,0,0,.6);
  --btn-sh-soft:0 1px 4px -1px rgba(0,0,0,.6);
  --scrim:rgba(13,12,11,.85); --scrim-2:rgba(23,22,20,.94);
  --ok-bg:#12241B;
}
[data-theme=dark] .story__img,[data-theme=dark] .face{border-color:var(--surface)}
[data-theme=dark] .btn[data-v=primary]:hover{background:#D6FA84;box-shadow:var(--btn-sh-h)}
[data-theme=dark] img{filter:brightness(.94)}
[data-theme=dark] .qr,[data-theme=dark] .qr i{filter:none}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f);font-size:var(--t-base);line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
:where(a,button,input,select,textarea,[tabindex]):focus-visible{
  outline:2px solid var(--brand-ink);outline-offset:2px;border-radius:var(--r1)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* --- type ---------------------------------------------------- */
.d1{font-size:var(--t-4xl);font-weight:800;line-height:.92;letter-spacing:-.045em;margin:0}
.d2{font-size:var(--t-3xl);font-weight:800;line-height:.96;letter-spacing:-.04em;margin:0}
.h1{font-size:var(--t-2xl);font-weight:800;line-height:1.05;letter-spacing:-.035em;margin:0}
.h2{font-size:var(--t-xl);font-weight:700;line-height:1.15;letter-spacing:-.03em;margin:0}
.h3{font-size:var(--t-lg);font-weight:700;line-height:1.2;letter-spacing:-.02em;margin:0}
.body{font-size:var(--t-base);color:var(--grey);margin:0}
.meta{font-family:var(--m);font-size:var(--t-xs);color:var(--grey);margin:0}
.eyebrow{font-family:var(--m);font-size:var(--t-2xs);text-transform:uppercase;
  letter-spacing:.14em;color:var(--grey);margin:0}
.price{font-family:var(--m);font-size:var(--t-sm);font-weight:500;color:var(--brand-ink)}
.price[data-free=true]{color:var(--grey)}
.muted{color:var(--grey)}

/* --- buttons -------------------------------------------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  padding:11px var(--s4);border:1px solid transparent;border-radius:var(--pill);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
  transition:transform .12s var(--ez),background-color .15s var(--ez),
             color .15s var(--ez),box-shadow .15s var(--ez)}
/* Pressing flattens the shadow as the button travels down. Without
   it the lift reads as a sticker rather than a control. */
.btn:active{transform:translateY(1px) scale(.99);box-shadow:var(--btn-sh-a)}
/* Lime on cream has no visible edge (1.20:1). The border supplies
   the component boundary WCAG 1.4.11 requires; dark mode does not
   need it, where lime reads 15.40:1 against the page. */
.btn[data-v=primary]{background:var(--brand);color:var(--on-brand);
  border-color:var(--brand-edge);box-shadow:var(--btn-sh)}
.btn[data-v=primary]:hover{background:#B4E24A;box-shadow:var(--btn-sh-h)}
.btn[data-v=ink]{background:var(--ink);color:var(--paper);box-shadow:var(--btn-sh)}
.btn[data-v=ink]:hover{background:var(--ink-2);box-shadow:var(--btn-sh-h)}
.btn[data-v=outline]{border-color:var(--ink);box-shadow:var(--btn-sh-soft)}
.btn[data-v=outline]:hover{background:var(--ink);color:var(--paper);box-shadow:var(--btn-sh-h)}
/* quiet stays flat until touched — that is what makes it quiet */
.btn[data-v=quiet]{color:var(--grey)}
.btn[data-v=quiet]:hover{color:var(--ink);background:var(--brand-soft);box-shadow:var(--btn-sh-soft)}
.btn[data-size=lg]{padding:15px var(--s5);font-size:var(--t-base);width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn[disabled]:hover{box-shadow:none}
.btn-row{display:flex;gap:var(--s2);flex-wrap:wrap}

/* --- chips / tags --------------------------------------------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px var(--s3);min-height:44px;
  border:1px solid var(--line);border-radius:var(--pill);background:var(--surface);
  font-family:var(--m);font-size:var(--t-xs);cursor:pointer;white-space:nowrap;
  transition:background-color .15s var(--ez),border-color .15s var(--ez)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand-edge);color:var(--on-brand)}
.tag{display:inline-block;padding:3px 7px;font-family:var(--m);font-size:var(--t-2xs);
  text-transform:uppercase;letter-spacing:.1em;border:1px solid var(--ink);border-radius:var(--r1)}
.tag[data-t=ink]{background:var(--ink);color:var(--paper)}
.tag[data-t=brand]{background:var(--brand);color:var(--on-brand);border-color:var(--brand-edge)}
.tag[data-t=soft]{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent}
.tag[data-t=line]{background:transparent;color:var(--grey);border-color:var(--line)}

.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--m);
  font-size:var(--t-2xs);text-transform:uppercase;letter-spacing:.12em;color:var(--live)}
.live::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--live);
  animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,27,0,.5)}
  70%{box-shadow:0 0 0 7px rgba(224,27,0,0)}100%{box-shadow:0 0 0 0 rgba(224,27,0,0)}}

/* --- avatar / mark -------------------------------------------- */
.mark{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:var(--r1);
  background:var(--ink);color:var(--paper);font-family:var(--m);font-size:var(--t-2xs)}
.mark[data-size=lg]{width:52px;height:52px;font-size:var(--t-sm);border-radius:var(--r2)}

/* --- social proof --------------------------------------------- */
.going{display:flex;align-items:center;gap:var(--s2)}
.going__stack{display:flex}
.face{width:24px;height:24px;border-radius:50%;flex:none;border:2px solid var(--surface);
  display:grid;place-items:center;background:var(--ink-2);color:var(--paper);
  font-family:var(--m);font-size:9px}
.face+.face{margin-left:-8px}
.going__n{font-family:var(--m);font-size:var(--t-xs);color:var(--grey)}
.going__n b{color:var(--ink);font-weight:600}

/* --- save ------------------------------------------------------ */
.save{position:absolute;top:var(--s3);right:var(--s3);z-index:2;width:44px;height:44px;
  display:grid;place-items:center;cursor:pointer;background:none;
  transition:transform .18s var(--ez)}
.save:hover svg{transform:scale(1.12)}
.save:active{transform:scale(.86)}

/* SVG rather than the heart glyphs: outline and filled hearts sit
   on different baselines in most system fonts, so the icon jumped
   on toggle. One path, fill swaps. */
.save svg{width:23px;height:23px;display:block;overflow:visible}
.save svg{filter:drop-shadow(0 1px 2px rgba(15,14,12,.55))
                 drop-shadow(0 0 6px rgba(15,14,12,.45));
  transition:transform .18s var(--ez)}
.save svg path{
  fill:rgba(15,14,12,.28);stroke:#fff;stroke-width:2;stroke-linejoin:round;
  transition:fill .2s var(--ez),stroke .2s var(--ez)}
.save[aria-pressed=true] svg path{fill:var(--brand);stroke:#fff}

/* The fill pops once on save. Confirmation you can feel. */
@keyframes savepop{
  0%{transform:scale(1)} 40%{transform:scale(1.28)} 100%{transform:scale(1)}
}
.save[aria-pressed=true] svg{animation:savepop .32s var(--ez)}
@media(prefers-reduced-motion:reduce){.save[aria-pressed=true] svg{animation:none}}

/* --- category tiles: label + live count (counts are information,
       circles were decoration) --------------------------------- */
.cat{display:flex;align-items:center;gap:var(--s3);flex:none;
  padding:var(--s3);width:186px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r2);cursor:pointer;text-align:left;
  transition:border-color .15s var(--ez),transform .15s var(--ez)}
.cat:hover{border-color:var(--ink);transform:translateY(-2px)}
.cat__i{width:40px;height:40px;border-radius:var(--r1);object-fit:cover;flex:none}
.cat__l{font-weight:600;font-size:var(--t-sm);line-height:1.2}
.cat__n{font-family:var(--m);font-size:var(--t-2xs);color:var(--grey)}
.cat[aria-pressed=true]{border-color:var(--brand-edge);background:var(--brand-soft)}
.cat[aria-pressed=true] .cat__n{color:var(--brand-ink)}
.cat-grid{display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fill,minmax(186px,1fr))}
.cat-grid .cat{width:auto}

/* --- follow card (Luma's "Featured Calendars") ---------------- */
.follow{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r2)}
.follow__b{flex:1;min-width:0}
.follow__b p{margin:0}
.follow__d{font-size:var(--t-sm);color:var(--grey);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* --- city header --------------------------------------------- */
.city{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.city__i{width:64px;height:64px;border-radius:var(--r2);object-fit:cover;flex:none}

/* --- date rail  (signature) ------------------------------------ */
.rail{display:grid;grid-template-columns:92px 1fr;gap:var(--s5)}
.rail+.rail{margin-top:var(--s6)}
.rail__d{position:relative;padding-top:2px}
.rail__n{font-size:44px;font-weight:800;line-height:.85;letter-spacing:-.05em}
.rail__m,.rail__w{font-family:var(--m);font-size:var(--t-2xs);text-transform:uppercase;
  letter-spacing:.16em;color:var(--grey);margin-top:5px}
.rail__w{color:var(--brand-ink);margin-top:2px}
.rail__d[data-today=true] .rail__n{color:var(--brand-ink)}
.rail__list{display:grid;gap:var(--s3);border-left:1px solid var(--line);padding-left:var(--s5)}
@media(max-width:720px){
  .rail{grid-template-columns:1fr;gap:var(--s3)}
  .rail__d{display:flex;align-items:baseline;gap:var(--s3)}
  .rail__n{font-size:30px}.rail__m,.rail__w{margin-top:0}
  .rail__list{border-left:0;padding-left:0}
}

/* --- card ------------------------------------------------------ */
.card{position:relative;display:block;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r2);overflow:hidden;cursor:pointer;
  transition:border-color .15s var(--ez),transform .15s var(--ez),box-shadow .2s var(--ez)}
.card:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:var(--sh)}
.card:active{transform:scale(.99)}
.card__b{min-width:0}
.card__tags{display:flex;gap:6px;margin-bottom:var(--s2);flex-wrap:wrap;align-items:center}
.card__f{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s3);min-width:0}
.card__f .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card__f .price{flex:none}
.card__t{margin:0 0 var(--s2)}
.card__when{margin:0 0 2px}
.card__where{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* status left, price right — price never gets squeezed by a long
   status label, because it is the number people scan for */
.card__s{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s3);min-width:0}
.card__s .price,.card__s .price-gate{margin-left:auto;flex:none}
/* Reads as a deliberate lock, not as a loading state */
.price-gate{display:inline-flex;align-items:center;gap:6px;flex:none;
  font-family:var(--m);font-size:var(--t-xs);color:var(--grey-2)}
.price-gate b{font-weight:600;color:var(--brand-ink);
  text-decoration:underline;text-underline-offset:2px}
.price-gate span[aria-hidden]{letter-spacing:-1px;font-size:9px;opacity:.6}
.card__s .tag,.card__s .live{flex:none}

.card[data-v=row]{display:grid;grid-template-columns:1fr 108px;gap:var(--s4);padding:var(--s4);align-items:start}
.card[data-v=row] .card__img{width:108px;height:108px;border-radius:var(--r1);object-fit:cover}
@media(max-width:560px){
  .card[data-v=row]{grid-template-columns:1fr 84px;gap:var(--s3);padding:var(--s3)}
  .card[data-v=row] .card__img{width:84px;height:84px}
}
.card[data-v=tile] .card__img{width:100%;aspect-ratio:4/3;object-fit:cover}
.card[data-v=tile] .card__b{padding:var(--s4)}
.card[data-v=hero]{border:0;min-height:360px;display:flex;align-items:flex-end}
.card[data-v=hero] .card__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card[data-v=hero]::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(15,14,12,.9) 0%,rgba(15,14,12,.35) 48%,transparent 78%)}
.card[data-v=hero] .card__b{position:relative;z-index:1;padding:var(--s5);color:var(--on-media);width:100%}
.card[data-v=hero] .meta,.card[data-v=hero] .going__n{color:rgba(250,248,244,.75)}
.card[data-v=hero] .h1{color:var(--on-media)}
.card[data-v=hero] .going__n b{color:var(--on-media)}
.card[data-v=hero] .face{border-color:rgba(15,14,12,.85);background:#3A352E;color:var(--on-media)}
.card[data-state=soldout] .card__img{filter:grayscale(1);opacity:.55}

/* --- forms ----------------------------------------------------- */
.field{display:grid;gap:6px;margin-bottom:var(--s4)}
.label{font-family:var(--m);font-size:var(--t-2xs);text-transform:uppercase;
  letter-spacing:.12em;color:var(--grey)}
.input{width:100%;padding:12px var(--s3);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r1);font-size:var(--t-base)}
.input:focus{border-color:var(--ink);outline:none}
.input::placeholder{color:var(--grey-2)}
textarea.input{min-height:96px;resize:vertical}
.hint{font-family:var(--m);font-size:var(--t-2xs);color:var(--grey-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
@media(max-width:520px){.two{grid-template-columns:1fr}}

.toggle{display:flex;align-items:center;gap:var(--s3);cursor:pointer;
  padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.track{width:42px;height:24px;border-radius:var(--pill);background:var(--line);
  position:relative;transition:background-color .18s var(--ez);flex:none}
.track::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;
  border-radius:50%;background:#fff;transition:transform .18s var(--ez)}
.toggle input:checked+.track{background:var(--brand-edge)}
.toggle input:checked+.track::after{transform:translateX(18px)}
.toggle input:focus-visible+.track{outline:2px solid var(--brand-ink);outline-offset:2px}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r1)}
.stepper button{width:46px;height:46px;font-size:19px;cursor:pointer}
.stepper button:hover{background:var(--brand-soft)}
.stepper span{min-width:44px;text-align:center;font-family:var(--m);font-weight:500}

/* --- ticket ---------------------------------------------------- */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.ticket__top{padding:var(--s5);display:grid;justify-items:center;gap:var(--s4);text-align:center}
/* QR stays light in both themes — inverted codes fail most scanners */
.qr{display:grid;padding:12px;background:#fff;border-radius:var(--r1)}
.qr i{display:block;width:6px;height:6px}
.perf{height:1px;border:0;border-top:2px dashed var(--line);margin:0;position:relative}
.perf::before,.perf::after{content:'';position:absolute;top:-11px;width:22px;height:22px;
  border-radius:50%;background:var(--paper)}
.perf::before{left:-11px}.perf::after{right:-11px}
.ticket__bot{padding:var(--s4) var(--s5);display:grid;gap:var(--s2)}
.kv{display:flex;justify-content:space-between;gap:var(--s4);font-size:var(--t-sm)}
.kv dt{color:var(--grey)}
.kv dd{margin:0;font-family:var(--m);text-align:right;min-width:0;overflow-wrap:anywhere}
.kv dt{flex:none}

/* --- misc ------------------------------------------------------ */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s5)}
.ink-panel{background:var(--ink);color:var(--paper);border-radius:var(--r2);padding:var(--s5)}
.ink-panel .meta,.ink-panel .body{color:rgba(250,248,244,.66)}
.empty{text-align:center;padding:var(--s8) var(--s5);border:1px dashed var(--line);
  border-radius:var(--r2);background:var(--surface)}
.empty__m{font-size:var(--t-3xl);font-weight:800;color:var(--brand-ink);line-height:1;letter-spacing:-.04em}
.roster{display:grid;gap:var(--s2)}
.roster__r{display:grid;grid-template-columns:36px 1fr auto;gap:var(--s3);align-items:center;
  padding:var(--s3);background:var(--surface);border:1px solid var(--line);border-radius:var(--r1)}
.roster__r[data-in=true]{border-color:var(--good);background:var(--ok-bg)}
.stat{display:grid;gap:2px}
.stat b{font-size:var(--t-2xl);font-weight:800;letter-spacing:-.03em;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:var(--s4)}
.tabs{display:flex;gap:var(--s1);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--pill);padding:var(--s1);width:fit-content}
.tabs button{padding:8px var(--s4);border-radius:var(--pill);font-size:var(--t-sm);
  font-weight:600;color:var(--grey);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--paper)}
.plan{display:grid;gap:var(--s3);padding:var(--s5);border-radius:var(--r2);
  border:1px solid var(--line);background:var(--surface)}
.plan[data-hot=true]{border-color:var(--brand-edge);border-width:2px}
.plan ul{margin:0;padding-left:var(--s4);display:grid;gap:var(--s2);
  font-size:var(--t-sm);color:var(--grey)}
.note{background:var(--brand-soft);border-radius:var(--r1);padding:var(--s3);
  font-size:var(--t-sm);color:var(--brand-ink)}

/* --- shell ----------------------------------------------------- */
.wrap{max-width:940px;margin:0 auto;padding:0 var(--s5)}
.grid{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.stack{display:grid;gap:var(--s3)}
.scroll-x{display:flex;gap:var(--s3);overflow-x:auto;padding-bottom:var(--s2);
  scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.sec{padding:var(--s6) 0}
.sec__h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);
  margin-bottom:var(--s4);flex-wrap:wrap}
.hr{height:1px;background:var(--line);border:0;margin:var(--s6) 0}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--s4);
  justify-content:space-between;padding:var(--s3) var(--s5);
  background:var(--scrim);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-size:var(--t-xl);font-weight:800;letter-spacing:-.05em;color:var(--brand-ink)}
.top__nav{display:flex;gap:var(--s5)}
.top__nav a{font-family:var(--m);font-size:var(--t-xs);text-transform:uppercase;
  letter-spacing:.1em;color:var(--grey);padding-bottom:2px;border-bottom:1px solid transparent}
.top__nav a:hover{color:var(--ink)}
.top__nav a[aria-current=page]{color:var(--ink);border-bottom-color:var(--brand)}
/* The top bar is now the only navigation, so it scrolls
   horizontally on narrow screens rather than disappearing. */
@media(max-width:720px){
  .top__nav{gap:var(--s4);overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;flex:1;min-width:0}
  .top__nav::-webkit-scrollbar{display:none}
  .top__nav a{white-space:nowrap;padding-bottom:4px}
  .top{gap:var(--s3);padding:var(--s3) var(--s4)}
  .brand{font-size:var(--t-lg)}
}
@media(max-width:520px){
  .top .btn[data-v=ink]{padding:9px var(--s3);font-size:var(--t-2xs)}
  .theme{width:36px;height:36px}
}
/* At 320px the nav strip is left with ~40px. The wordmark is the
   least useful thing in the bar once you are inside the app. */
@media(max-width:340px){
  .brand{font-size:0}
  .brand::after{content:'K';font-size:var(--t-lg)}
  .top{gap:var(--s2);padding:var(--s3) var(--s3)}
  .theme{width:32px;height:32px}
}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;
  display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s5);
  background:var(--scrim-2);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bar .btn{flex:none;min-width:150px}

.theme{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r1);
  border:1px solid var(--line);cursor:pointer;font-size:15px;flex:none;
  transition:background-color .15s var(--ez),border-color .15s var(--ez)}
.theme:hover{border-color:var(--ink);background:var(--brand-soft)}
#searchbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round}
/* current page: the icon fills so you can tell you are already there */
#searchbtn[aria-current=page]{background:var(--brand);border-color:var(--brand-edge);
  color:var(--on-brand)}

.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--m);
  font-size:var(--t-xs);color:var(--grey);padding:var(--s4) var(--s2) var(--s4) 0;
  min-height:44px;cursor:pointer}
.back:hover{color:var(--ink)}

.cover{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--r2)}
@media(max-width:560px){.cover{aspect-ratio:4/3}}


/* ============================================================
   ADMIN CONSOLE
   A control surface, not a shop window. Dense rows, one accent,
   no motion. Tokens are shared with the public site so the two
   cannot drift, but every proportion here is tighter.
   ============================================================ */
body{padding-bottom:0;font-size:var(--t-sm)}

/* --- app frame: fixed sidebar, scrolling main ---------------- */
.ap{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);
  display:grid;grid-template-rows:auto 1fr auto;scrollbar-width:thin}
.side__b{padding:var(--s4) var(--s4) var(--s3);display:flex;align-items:center;gap:8px}
.side__b b{font-family:var(--f-display);font-size:var(--t-lg);font-weight:800;letter-spacing:-.05em;color:var(--brand-ink)}
.side__b em{font-style:normal;font-family:var(--m);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--grey);border:1px solid var(--line);
  padding:2px 5px;border-radius:var(--r1)}
.side__n{padding:0 var(--s2);display:grid;gap:1px;align-content:start}
.side__g{font-family:var(--m);font-size:9px;text-transform:uppercase;letter-spacing:.12em;
  color:var(--grey-2);padding:var(--s4) var(--s3) 6px}
.side a{display:flex;align-items:center;gap:10px;padding:8px var(--s3);border-radius:var(--r1);
  color:var(--grey);font-size:var(--t-sm);transition:background-color .1s var(--ez)}
.side a:hover{background:var(--brand-soft);color:var(--brand-ink)}
.side a[aria-current=page]{background:var(--ink);color:var(--paper);font-weight:600}
.side a i{font-style:normal;width:16px;text-align:center;font-size:13px;opacity:.85}
.side a u{margin-left:auto;text-decoration:none;font-family:var(--m);font-size:9px;
  padding:1px 6px;border-radius:var(--pill);background:var(--live);color:#fff}
.side a[aria-current=page] u{background:var(--paper);color:var(--ink)}
.side__f{padding:var(--s3) var(--s4);border-top:1px solid var(--line);display:grid;gap:6px}
.side__f a{padding:6px var(--s2);font-size:var(--t-xs)}

.main{min-width:0;display:flex;flex-direction:column}
.top2{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s5);background:var(--scrim);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.crumb{font-family:var(--m);font-size:var(--t-2xs);color:var(--grey);letter-spacing:.06em}
.crumb b{color:var(--ink);font-weight:600}
.gsearch{flex:1;max-width:420px;position:relative}
.gsearch input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);
  border-radius:var(--r1);background:var(--surface);font-size:var(--t-sm)}
.gsearch svg{position:absolute;left:10px;top:9px;width:15px;height:15px;
  fill:none;stroke:var(--grey-2);stroke-width:2}
.gsearch kbd{position:absolute;right:8px;top:8px;font-family:var(--m);font-size:9px;
  color:var(--grey-2);border:1px solid var(--line);border-radius:3px;padding:2px 5px}
.top2__r{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}

.page{padding:var(--s5);display:grid;gap:var(--s4);align-content:start;flex:1}
@media(max-width:1000px){
  .ap{grid-template-columns:1fr}
  .side{position:static;height:auto;grid-template-rows:auto auto auto}
  .side__n{grid-auto-flow:column;overflow-x:auto;scrollbar-width:none}
  .side__n::-webkit-scrollbar{display:none}
  .side__g,.side__f{display:none}
  .side a{white-space:nowrap}
  .page{padding:var(--s4)}
  .gsearch kbd{display:none}
}

/* --- page header --------------------------------------------- */
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);
  flex-wrap:wrap}
.ph h1{font-family:var(--f-display);font-size:var(--t-2xl);font-weight:800;letter-spacing:-.035em;margin:0}
.ph p{margin:3px 0 0;font-size:var(--t-sm);color:var(--grey)}

/* --- metric strip -------------------------------------------- */
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s3)}
.met{padding:var(--s4);border:1px solid var(--line);border-radius:var(--r2);
  background:var(--surface)}
.met b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.met span{font-family:var(--m);font-size:9px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--grey);display:block;margin-top:3px}
.met i{font-style:normal;font-family:var(--m);font-size:var(--t-2xs);display:block;margin-top:6px}
.met i[data-d=up]{color:var(--good)}
.met i[data-d=down]{color:var(--live)}
.met i[data-d=flat]{color:var(--grey-2)}

/* --- card ---------------------------------------------------- */
.cd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);
  overflow:hidden}
.cd__h{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.cd__h h2{font-size:var(--t-base);font-weight:700;letter-spacing:-.01em;margin:0}
.cd__h .meta{margin:0}
.cd__h>.btn-row{margin-left:auto}
.cd__b{padding:var(--s4)}
.cd__b--flush{padding:0}
.cd__f{padding:var(--s3) var(--s4);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}

/* --- toolbar (filters above a table) ------------------------- */
.tb{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.tb input,.tb select{padding:7px 10px;border:1px solid var(--line);border-radius:var(--r1);
  background:var(--surface);font-size:var(--t-sm)}
.tb input[type=search]{min-width:180px}
.tb__r{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}
.seg2{display:flex;border:1px solid var(--line);border-radius:var(--r1);overflow:hidden}
.seg2 button{padding:7px 12px;font-size:var(--t-xs);font-weight:600;color:var(--grey);
  cursor:pointer;border-right:1px solid var(--line)}
.seg2 button:last-child{border-right:0}
.seg2 button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

.views{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:8px var(--s4);border-bottom:1px solid var(--line);background:var(--paper)}
.vchip{display:inline-flex;align-items:center;border:1px solid var(--line);
  border-radius:var(--pill);background:var(--surface);overflow:hidden}
.vchip button{padding:4px 10px;font-size:var(--t-xs);font-weight:600;cursor:pointer;
  color:var(--ink)}
.vchip button:first-child:hover{background:var(--brand-soft);color:var(--brand-ink)}
.vchip button:last-child{padding:4px 8px 4px 4px;color:var(--grey-2);font-size:13px}
.vchip button:last-child:hover{color:var(--live)}

/* --- data table ---------------------------------------------- */
.tw{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
.dt th{text-align:left;font-family:var(--m);font-size:9px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--grey);font-weight:500;padding:10px var(--s4);
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);
  position:sticky;top:0;z-index:2}
.dt th[data-sort]{cursor:pointer;user-select:none}
.dt th[data-sort]:hover{color:var(--ink)}
.dt th[aria-sort] span{color:var(--brand-ink)}
.dt td{padding:11px var(--s4);border-bottom:1px solid var(--line);vertical-align:middle}
.dt tr:last-child td{border-bottom:0}
.dt tbody tr{transition:background-color .1s var(--ez)}
.dt tbody tr:hover{background:var(--brand-soft)}
.dt tbody tr[data-sel=true]{background:var(--brand-soft)}
.dt td.num{font-family:var(--m);text-align:right;white-space:nowrap}
.dt td.act{text-align:right;white-space:nowrap}
.dt .ttl{font-weight:600;letter-spacing:-.01em}
.dt .sub{font-family:var(--m);font-size:var(--t-2xs);color:var(--grey);margin-top:2px}
.dt input[type=checkbox]{width:15px;height:15px;accent-color:var(--brand-edge);cursor:pointer}
.dt .cell{display:flex;align-items:center;gap:10px;min-width:0}
.dt .thumb{width:34px;height:34px;border-radius:var(--r1);object-fit:cover;flex:none;
  border:1px solid var(--line)}

/* --- status pills -------------------------------------------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:var(--pill);
  font-family:var(--m);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid transparent;white-space:nowrap}
.pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.pill[data-s=live],.pill[data-s=active],.pill[data-s=paid],.pill[data-s=confirmed]
  {background:#EAF7DF;color:#2F6B1F}
.pill[data-s=pending],.pill[data-s=review],.pill[data-s=scheduled]
  {background:var(--brand-soft);color:var(--brand-ink)}
.pill[data-s=draft],.pill[data-s=ended]{background:var(--paper);color:var(--grey);
  border-color:var(--line)}
.pill[data-s=suspended],.pill[data-s=cancelled],.pill[data-s=refunded],.pill[data-s=rejected]
  {background:#FDEBE8;color:#A31708}
[data-theme=dark] .pill[data-s=live],[data-theme=dark] .pill[data-s=active],
[data-theme=dark] .pill[data-s=paid],[data-theme=dark] .pill[data-s=confirmed]
  {background:#16301A;color:#8FD14F}
[data-theme=dark] .pill[data-s=suspended],[data-theme=dark] .pill[data-s=cancelled],
[data-theme=dark] .pill[data-s=refunded],[data-theme=dark] .pill[data-s=rejected]
  {background:#3A1512;color:#FF8A7A}

/* --- bulk action bar ----------------------------------------- */
.bulk{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s4);
  background:var(--ink);color:var(--paper);flex-wrap:wrap}
.bulk b{font-family:var(--m);font-size:var(--t-xs)}
.bulk .btn-row{margin-left:auto}
.bulk .btn[data-v=quiet]{color:rgba(250,248,244,.8)}
.bulk .btn[data-v=quiet]:hover{color:var(--paper);background:rgba(250,248,244,.12)}

/* --- detail drawer ------------------------------------------- */
.dw{position:fixed;inset:0;z-index:80;display:none}
.dw[data-open=true]{display:block}
.dw__s{position:absolute;inset:0;background:rgba(15,14,12,.45);backdrop-filter:blur(2px)}
.dw__p{position:absolute;top:0;right:0;bottom:0;width:min(520px,100%);
  background:var(--paper);border-left:1px solid var(--line);
  box-shadow:-24px 0 60px -24px rgba(15,14,12,.4);
  display:grid;grid-template-rows:auto 1fr auto;animation:slidein .22s var(--ez)}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.dw__h{padding:var(--s4) var(--s5);border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;gap:var(--s3);background:var(--surface)}
.dw__h h3{margin:0;font-size:var(--t-lg);font-weight:700;letter-spacing:-.02em}
.dw__h .meta{margin:3px 0 0}
.dw__x{margin-left:auto;width:32px;height:32px;border-radius:var(--r1);cursor:pointer;
  display:grid;place-items:center;color:var(--grey);font-size:17px;flex:none}
.dw__x:hover{background:var(--brand-soft);color:var(--brand-ink)}
.dw__b{overflow-y:auto;padding:var(--s5);display:grid;gap:var(--s4);align-content:start}
.dw__f{padding:var(--s4) var(--s5);border-top:1px solid var(--line);background:var(--surface);
  display:flex;gap:var(--s2);flex-wrap:wrap}
.kv2{display:grid;grid-template-columns:120px 1fr;gap:8px var(--s3);font-size:var(--t-sm)}
.kv2 dt{color:var(--grey);font-family:var(--m);font-size:var(--t-2xs);padding-top:2px}
.kv2 dd{margin:0}
@media(prefers-reduced-motion:reduce){.dw__p{animation:none}}

/* --- misc ---------------------------------------------------- */
.tl{display:grid;gap:0}
.tl__r{display:grid;grid-template-columns:112px 1fr auto;gap:var(--s3);padding:9px 0;
  border-bottom:1px solid var(--line);align-items:baseline;font-size:var(--t-sm)}
.tl__r:last-child{border-bottom:0}
.tl__r time{font-family:var(--m);font-size:var(--t-2xs);color:var(--grey-2)}
@media(max-width:560px){.tl__r{grid-template-columns:1fr;gap:2px}}

.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:var(--s3)}
.bars div{flex:1;display:grid;justify-items:center;gap:6px;align-content:end;height:100%}
.bars i{width:100%;background:var(--brand-soft);border-top:3px solid var(--brand-edge);
  border-radius:3px 3px 0 0;min-height:3px}
.bars span{font-family:var(--m);font-size:9px;color:var(--grey)}

.chips2{display:flex;flex-wrap:wrap;gap:6px}
.chip2{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--pill);
  background:var(--brand-soft);color:var(--brand-ink);font-size:var(--t-xs);font-weight:600}
.chip2 button{cursor:pointer;color:inherit;opacity:.55;line-height:1;font-size:13px}
.chip2 button:hover{opacity:1}

.swatch{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.swatch input[type=color]{width:54px;height:38px;padding:2px;border:1px solid var(--line);
  border-radius:var(--r1);cursor:pointer;background:var(--surface)}
.swatch code{font-family:var(--m);font-size:var(--t-sm)}
/* typeface picker */
/* --- charts: SVG, no library ---------------------------------- */
.ch{display:grid;gap:var(--s3)}
.ch svg{width:100%;height:auto;display:block;overflow:visible}
.ch__area{fill:var(--brand);opacity:.18}
.ch__line{fill:none;stroke:var(--brand-edge);stroke-width:2.5;
  stroke-linejoin:round;stroke-linecap:round}
.ch__dot{fill:var(--surface);stroke:var(--brand-edge);stroke-width:2.5}
.ch__grid{stroke:var(--line);stroke-width:1}
.ch__lab{font-family:var(--m);font-size:9px;fill:var(--grey-2)}
.ch__val{font-family:var(--m);font-size:10px;fill:var(--ink);font-weight:500}

.don{display:flex;align-items:center;gap:var(--s5);flex-wrap:wrap}
.don svg{width:132px;height:132px;flex:none}
.don__k{display:grid;gap:6px;flex:1;min-width:150px}
.don__r{display:flex;align-items:center;gap:8px;font-size:var(--t-xs)}
.don__r i{width:9px;height:9px;border-radius:2px;flex:none}
.don__r b{margin-left:auto;font-family:var(--m);font-weight:500}

.fun{display:grid;gap:6px}
.fun__r{display:grid;grid-template-columns:118px 1fr auto;gap:var(--s3);align-items:center;
  font-size:var(--t-xs)}
.fun__b{height:22px;border-radius:3px;background:var(--brand-soft);
  border-left:3px solid var(--brand-edge);position:relative}
.fun__r b{font-family:var(--m);font-weight:500;white-space:nowrap}
.fun__d{font-family:var(--m);font-size:9px;color:var(--grey-2)}

.rank{display:grid;gap:2px}
.rank__r{display:grid;grid-template-columns:18px 1fr auto;gap:var(--s3);align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line);font-size:var(--t-sm)}
.rank__r:last-child{border-bottom:0}
.rank__r i{font-style:normal;font-family:var(--m);font-size:9px;color:var(--grey-2)}
.rank__r b{font-family:var(--m);font-weight:500}

.two-up{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
@media(max-width:1000px){.two-up{grid-template-columns:1fr}}

/* --- masters -------------------------------------------------- */
.ms{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s3)}
.ms__c{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);
  overflow:hidden;display:grid;align-content:start}
.ms__h{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px}
.ms__h b{font-size:var(--t-sm);font-weight:700}
.ms__h .lock{margin-left:auto}
.ms__n{padding:8px var(--s4) 0;font-size:var(--t-2xs);color:var(--grey);line-height:1.5}
.ms__l{padding:var(--s3) var(--s4) var(--s4);display:grid;gap:4px}
.ms__i{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;
  padding:5px 0;border-bottom:1px solid var(--line);font-size:var(--t-xs)}
.ms__i:last-child{border-bottom:0}

/* ------------------------------------------------------------
   CSV EXPORT
   Escaping is the whole job: a title containing a comma, a quote
   or a newline will corrupt the file otherwise, and event titles
   are host-authored free text.
   ------------------------------------------------------------ */
function csvCell(v){
  const s=String(v==null?'':v);
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function toCsv(cols, rows){
  const head=cols.map(c=>csvCell(c.label)).join(',');
  const body=rows.map(r=>cols.map(c=>csvCell(c.get(r))).join(',')).join('\r\n');
  return head+'\r\n'+body;
}
function download(name, text){
  try{
    /* BOM so Excel opens UTF-8 correctly rather than mangling
       the en-dashes in event titles */
    const blob=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },0);
    return true;
  }catch(e){ return false; }
}

/* ------------------------------------------------------------
   CHARTS — hand-drawn SVG. A charting library would be 60KB to
   render six data points, and every one of these is a fixed shape.
   ------------------------------------------------------------ */
function sparkArea(series, get, fmt){
  const w=560, h=150, pl=44, pr=8, pt=14, pb=22;
  const vals=series.map(get);
  const max=Math.max(...vals)*1.12, min=0;
  const x=i=>pl+(w-pl-pr)*(i/(series.length-1));
  const y=v=>pt+(h-pt-pb)*(1-(v-min)/(max-min));
  const pts=vals.map((v,i)=>[x(i),y(v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+' L'+x(series.length-1).toFixed(1)+' '+(h-pb)+' L'+pl+' '+(h-pb)+' Z';
  const ticks=[0,.5,1].map(t=>{
    const v=min+(max-min)*t, yy=y(v);
    return '<line class="ch__grid" x1="'+pl+'" x2="'+(w-pr)+'" y1="'+yy.toFixed(1)+
      '" y2="'+yy.toFixed(1)+'"/>'+
      '<text class="ch__lab" x="'+(pl-6)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end">'+
      fmt(v)+'</text>';
  }).join('');
  return '<div class="ch"><svg viewBox="0 0 '+w+' '+h+'" role="img" '+
    'aria-label="Trend over '+series.length+' months">'+ticks+
    '<path class="ch__area" d="'+area+'"/><path class="ch__line" d="'+line+'"/>'+
    pts.map((p,i)=>'<circle class="ch__dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+
      '" r="3.5"/>').join('')+
    series.map((d,i)=>'<text class="ch__lab" x="'+x(i).toFixed(1)+'" y="'+(h-6)+
      '" text-anchor="middle">'+esc(d.m)+'</text>').join('')+
    '<text class="ch__val" x="'+(x(series.length-1)-4).toFixed(1)+'" y="'+
      (y(vals[vals.length-1])-9).toFixed(1)+'" text-anchor="end">'+
      fmt(vals[vals.length-1])+'</text>'+
    '</svg></div>';
}

function donut(rows){
  const total=rows.reduce((n,r)=>n+r.v,0)||1;
  const R=52, C=2*Math.PI*R;
  let off=0;
  const arcs=rows.map(r=>{
    const frac=r.v/total, len=C*frac;
    const seg='<circle r="'+R+'" cx="66" cy="66" fill="none" stroke="'+r.c+
      '" stroke-width="20" stroke-dasharray="'+len.toFixed(1)+' '+(C-len).toFixed(1)+
      '" stroke-dashoffset="'+(-off).toFixed(1)+'" transform="rotate(-90 66 66)"/>';
    off+=len; return seg;
  }).join('');
  return '<div class="don"><svg viewBox="0 0 132 132" role="img" aria-label="Category mix">'+
    arcs+'<text x="66" y="63" text-anchor="middle" class="ch__val" '+
    'style="font-size:17px;font-weight:800">'+total+'</text>'+
    '<text x="66" y="77" text-anchor="middle" class="ch__lab">events</text></svg>'+
    '<div class="don__k">'+rows.map(r=>
      '<span class="don__r"><i style="background:'+r.c+'"></i>'+esc(r.k)+
      '<b>'+r.v+'</b></span>').join('')+'</div></div>';
}

function funnel(steps){
  const top=steps[0].v||1;
  return '<div class="fun">'+steps.map((s,i)=>{
    const pct=s.v/top*100;
    const drop=i?Math.round((1-s.v/steps[i-1].v)*100):0;
    return '<div class="fun__r"><span>'+esc(s.k)+'</span>'+
      '<span class="fun__b" style="width:'+Math.max(4,pct).toFixed(1)+'%"></span>'+
      '<b>'+s.v.toLocaleString('en-GB')+
      (i?' <span class="fun__d">\u2212'+drop+'%</span>':'')+'</b></div>';
  }).join('')+'</div>';
}

function metric(value,label,delta,dir){
  return '<div class="met"><b>'+value+'</b><span>'+esc(label)+'</span>'+
    (delta?'<i data-d="'+(dir||'flat')+'">'+esc(delta)+'</i>':'')+'</div>';
}

function card(title, body, opts){
  opts=opts||{};
  return '<section class="cd">'+
    (title ? '<div class="cd__h"><h2>'+esc(title)+'</h2>'+
      (opts.sub?'<span class="meta">'+esc(opts.sub)+'</span>':'')+
      (opts.actions?'<div class="btn-row">'+opts.actions+'</div>':'')+'</div>' : '')+
    '<div class="cd__b'+(opts.flush?' cd__b--flush':'')+'">'+body+'</div>'+
    (opts.foot?'<div class="cd__f">'+opts.foot+'</div>':'')+
  '</section>';
}

/* ------------------------------------------------------------
   DataTable — one component behind every list in the console.
   Sorting, filtering and selection live in TSTATE keyed by table
   id, so switching sections never loses a filter.
   ------------------------------------------------------------ */
/* Saved views. A filter set an operator rebuilds every morning is
   a filter set they should be able to name once. */
const VIEWS_SAVED = Store.read('kreo-views', {});

function saveView(tableId, name){
  const st=tstate(tableId);
  (VIEWS_SAVED[tableId] = VIEWS_SAVED[tableId] || [])
    .push({name, q:st.q, filters:{...st.filters}, sort:st.sort, dir:st.dir});
  Store.write('kreo-views', VIEWS_SAVED);
}
function applyView(tableId, i){
  const v=(VIEWS_SAVED[tableId]||[])[i];
  if(!v) return;
  const st=tstate(tableId);
  st.q=v.q; st.filters={...v.filters}; st.sort=v.sort; st.dir=v.dir; st.sel.clear();
}
function dropView(tableId, i){
  (VIEWS_SAVED[tableId]||[]).splice(i,1);
  Store.write('kreo-views', VIEWS_SAVED);
}
function viewBar(tableId){
  const list=VIEWS_SAVED[tableId]||[];
  const st=tstate(tableId);
  const dirty = st.q || Object.values(st.filters||{}).some(Boolean);
  if(!list.length && !dirty) return '';
  return '<div class="views">'+
    list.map((v,i)=>'<span class="vchip">'+
      '<button data-useview="'+tableId+':'+i+'">'+esc(v.name)+'</button>'+
      '<button data-dropview="'+tableId+':'+i+'" aria-label="Delete view">&times;</button></span>').join('')+
    (dirty?'<button class="btn" data-v="quiet" style="padding:4px 10px" '+
      'data-saveview="'+tableId+'">Save this view</button>':'')+
  '</div>';
}

const TSTATE = {};
function tstate(id){
  if(!TSTATE[id]) TSTATE[id]={sort:null, dir:'asc', sel:new Set(), q:'', filters:{}};
  return TSTATE[id];
}

function table(id, cols, rows, opts){
  opts=opts||{};
  const st=tstate(id);
  if(st.sort){
    const c=cols.find(c=>c.key===st.sort);
    if(c && c.val) rows=[...rows].sort((a,b)=>{
      const x=c.val(a), y=c.val(b);
      const r = typeof x==='number' ? x-y : String(x).localeCompare(String(y));
      return st.dir==='asc' ? r : -r;
    });
  }
  const selectable = !!opts.select;
  const allSel = selectable && rows.length && rows.every(r=>st.sel.has(r.id));

  const head='<tr>'+
    (selectable?'<th style="width:34px"><input type="checkbox" data-all="'+id+'"'+
      (allSel?' checked':'')+' aria-label="Select all"></th>':'')+
    cols.map(c=>{
      const sorted = st.sort===c.key;
      return '<th'+(c.val?' data-sort="'+c.key+'" data-table="'+id+'"':'')+
        (sorted?' aria-sort="'+(st.dir==='asc'?'ascending':'descending')+'"':'')+
        (c.align==='right'?' style="text-align:right"':'')+'>'+esc(c.label)+
        (sorted?' <span>'+(st.dir==='asc'?'\u2191':'\u2193')+'</span>':'')+'</th>';
    }).join('')+'</tr>';

  const body = rows.length ? rows.map(r=>
    '<tr data-sel="'+st.sel.has(r.id)+'"'+(opts.open?' data-open="'+id+':'+r.id+'"':'')+
      ' style="cursor:'+(opts.open?'pointer':'default')+'">'+
      (selectable?'<td><input type="checkbox" data-row="'+id+'" value="'+r.id+'"'+
        (st.sel.has(r.id)?' checked':'')+' aria-label="Select row"></td>':'')+
      cols.map(c=>'<td'+(c.cls?' class="'+c.cls+'"':'')+'>'+c.cell(r)+'</td>').join('')+
    '</tr>').join('')
    : '<tr><td colspan="'+(cols.length+(selectable?1:0))+'">'+
      empty(opts.emptyTitle||'Nothing here', opts.emptySub||'')+'</td></tr>';

  return '<div class="tw"><table class="dt"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
}

function bulkBar(id, actions){
  const st=tstate(id);
  if(!st.sel.size) return '';
  return '<div class="bulk"><b>'+st.sel.size+' selected</b>'+
    '<div class="btn-row">'+actions+
      '<button class="btn" data-v="quiet" data-clearsel="'+id+'">Clear</button></div></div>';
}

const V={};

V.overview=()=>{
  const live=EVENTS.filter(e=>e.status==='live');
  const seats=live.reduce((n,e)=>n+e.booked,0);
  const gmv=live.reduce((n,e)=>n+e.booked*e.price,0);
  const fill=Math.round(live.reduce((n,e)=>n+e.booked/e.cap,0)/live.length*100);
  const paid=live.filter(e=>e.price>0);
  const aov=paid.length ? gmv/BOOKINGS.filter(b=>b.status==='confirmed').length : 0;
  const prev=TREND[TREND.length-2], now=TREND[TREND.length-1];
  const pct=(a,b)=>Math.round((a-b)/b*100);

  /* category mix, biggest first, tail folded into Other so the
     donut never becomes a colour-matching exercise */
  const byCat={};
  live.forEach(e=>{ byCat[e.cat]=(byCat[e.cat]||0)+1; });
  const tones=['#6E9314','#8FD14F','#C7F464','#4285F4','#F54E00','#6D28D9'];
  const sorted=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const mix=sorted.slice(0,5).map(([k,v],i)=>({k,v,c:tones[i]}));
  const tail=sorted.slice(5).reduce((n,x)=>n+x[1],0);
  if(tail) mix.push({k:'Other',v:tail,c:tones[5]});

  const topHosts=HOSTS.map(h=>({h, rev:EVENTS.filter(e=>e.host===h.id)
      .reduce((n,e)=>n+e.booked*e.price,0)}))
    .filter(x=>x.rev>0).sort((a,b)=>b.rev-a.rev).slice(0,5);

  const views=live.reduce((n,e)=>n+e.views,0);

  return '<div class="mets">'+
      metric(aed(gmv),'Gross value', pct(now.gmv,prev.gmv)+'% vs Jul','up')+
      metric(aed(gmv*CMS.feePct/100),'Net revenue', CMS.feePct+'% take rate','flat')+
      metric(seats,'Seats sold', pct(now.bookings,prev.bookings)+'% vs Jul','up')+
      metric(aed(aov),'Avg booking value')+
      metric(fill+'%','Capacity filled', fill<60?'below target':'on target',
        fill<60?'down':'up')+
      metric(queueCount(),'Awaiting review', queueCount()?'needs action':'clear',
        queueCount()?'down':'up')+
    '</div>'+

    (queueCount()
      ? card('Needs action',
          HOSTS.filter(h=>h.status==='pending').map(h=>
            '<div class="tl__r"><time>Host</time>'+
            '<span><b>'+esc(h.name)+'</b> applied '+dshort(h.joined)+'</span>'+
            '<button class="btn" data-v="outline" data-openhost="'+h.id+'">Review</button></div>').join('')+
          EVENTS.filter(e=>e.status==='review').map(e=>
            '<div class="tl__r"><time>Event</time>'+
            '<span><b>'+esc(e.title)+'</b> by '+esc((host(e.host)||{}).name)+'</span>'+
            '<button class="btn" data-v="outline" data-openev="'+e.id+'">Review</button></div>').join(''),
          {sub:queueCount()+' waiting',
           actions:'<a class="btn" data-v="quiet" href="#/moderation">Open queue</a>'})
      : '')+

    '<div class="two-up">'+
      card('Gross value, six months',
        sparkArea(TREND, d=>d.gmv, v=>'AED '+Math.round(v/1000)+'k'),
        {sub:'AED '+now.gmv.toLocaleString('en-GB')+' this month'})+
      card('Bookings, six months',
        sparkArea(TREND, d=>d.bookings, v=>Math.round(v)),
        {sub:now.bookings+' this month'})+
    '</div>'+

    '<div class="two-up">'+
      card('Category mix', donut(mix), {sub:'Live events by category'})+
      card('Browse to booking',
        funnel([
          {k:'Event views', v:views},
          {k:'Detail opened', v:Math.round(views*0.34)},
          {k:'Checkout started', v:Math.round(views*0.09)},
          {k:'Booked', v:seats}
        ]),
        {sub:'Last 30 days',
         foot:'<span class="meta">The steepest drop is view to detail. That is a card '+
              'problem \u2014 title, image or price \u2014 not a checkout problem.</span>'})+
    '</div>'+

    '<div class="two-up">'+
      card('Top hosts by revenue',
        '<div class="rank">'+topHosts.map((x,i)=>
          '<div class="rank__r"><i>'+(i+1)+'</i>'+
          '<span>'+esc(x.h.name)+'</span><b>'+aed(x.rev)+'</b></div>').join('')+'</div>')+
      card('Recent activity',
        '<div class="tl">'+AUDIT.slice(0,6).map(a=>
          '<div class="tl__r"><time>'+tstamp(a.at)+'</time>'+
          '<span>'+esc(a.what)+' \u2014 <b>'+esc(a.target)+'</b></span>'+
          '<span class="meta">'+esc(a.who)+'</span></div>').join('')+'</div>',
        {actions:'<a class="btn" data-v="quiet" href="#/audit">Full log</a>'})+
    '</div>';
};

/* One predicate per list, used by the view AND the exporter. A CSV
   that disagrees with the screen is worse than no CSV. */
function filteredEvents(){
  const st=tstate('t-ev'), f=st.filters;
  return EVENTS.filter(e=>{
    if(st.q){
      const hay=(e.title+' '+(host(e.host)||{}).name+' '+e.cat+' '+hubName(e.hub)).toLowerCase();
      if(!hay.includes(st.q.toLowerCase())) return false;
    }
    if(f.status && e.status!==f.status) return false;
    if(f.cat && e.cat!==f.cat) return false;
    if(f.hub && e.hub!==f.hub) return false;
    if(f.host && e.host!==f.host) return false;
    return true;
  });
}
function filteredBookings(){
  const st=tstate('t-bk'), f=st.filters;
  return BOOKINGS.filter(b=>{
    if(st.q){
      const hay=(b.who+' '+b.id+' '+(ev(b.ev)||{}).title).toLowerCase();
      if(!hay.includes(st.q.toLowerCase())) return false;
    }
    if(f.status && b.status!==f.status) return false;
    if(f.method && b.method!==f.method) return false;
    return true;
  });
}

V.hosts=()=>{
  const st=tstate('t-h'); const f=st.filters;
  let rows=HOSTS.filter(h=>{
    if(st.q && !h.name.toLowerCase().includes(st.q.toLowerCase())) return false;
    if(f.status && h.status!==f.status) return false;
    return true;
  });
  const lapsed=HOSTS.filter(h=>h.expires<TODAY).length;
  return '<div class="mets">'+
      metric(HOSTS.filter(h=>h.status==='active').length,'Active')+
      metric(HOSTS.filter(h=>h.status==='pending').length,'Pending')+
      metric(HOSTS.filter(h=>h.status==='suspended').length,'Suspended')+
      metric(lapsed,'Licence lapsed', lapsed?'listings paused':'', lapsed?'down':'flat')+
    '</div>'+
    card(null,
      '<div class="tb">'+
        '<input type="search" data-tq="t-h" value="'+esc(st.q)+'" placeholder="Search hosts">'+
        '<select data-tf="t-h:status"><option value="">Any status</option>'+
          ['active','pending','suspended','rejected'].map(s=>
            '<option'+(f.status===s?' selected':'')+'>'+s+'</option>').join('')+'</select>'+
        '<div class="tb__r"><span class="meta">'+rows.length+' of '+HOSTS.length+'</span></div></div>'+
      bulkBar('t-h',
        '<button class="btn" data-v="quiet" data-bulk="t-h:approve">Approve</button>'+
        '<button class="btn" data-v="quiet" data-bulk="t-h:suspend">Suspend</button>')+
      table('t-h',[
        {key:'name',label:'Host',val:r=>r.name,cell:r=>'<div class="cell">'+mark(r.ini)+
          '<div><div class="ttl">'+esc(r.name)+(r.verified?' &#10003;':'')+'</div>'+
          '<div class="sub">joined '+dshort(r.joined)+'</div></div></div>'},
        {key:'ev',label:'Events',val:r=>EVENTS.filter(e=>e.host===r.id).length,cls:'num',align:'right',
         cell:r=>EVENTS.filter(e=>e.host===r.id).length},
        {key:'fol',label:'Followers',val:r=>r.followers,cls:'num',align:'right',
         cell:r=>r.followers.toLocaleString('en-GB')},
        {key:'lic',label:'Licence',val:r=>r.expires,
         cell:r=>'<span class="meta">'+esc(r.expires)+(r.expires<TODAY?' \u00b7 lapsed':'')+'</span>'},
        {key:'pay',label:'Payouts',val:r=>r.payoutOk?1:0,
         cell:r=>r.payoutOk?'<span class="meta">connected</span>':'<span class="meta">not set up</span>'},
        {key:'status',label:'Status',val:r=>r.status,cell:r=>pill(r.status)}

      {flush:true});

    card('Payout runs',

/* ---- Integrations ------------------------------------------- */
V.integrations=()=>{
  const st=tstate('t-ig');
  const groups=[...new Set(INTEGRATIONS.map(i=>i.group))];
  const f=st.filters.group||'';
  const list=INTEGRATIONS.filter(i=>{
    if(f && i.group!==f) return false;
    if(st.q && !(i.name+' '+i.group+' '+i.what).toLowerCase().includes(st.q.toLowerCase()))
      return false;
    return true;
  });
  const on=INTEGRATIONS.filter(i=>i.state==='connected').length;
  const missing=INTEGRATIONS.filter(i=>i.required && i.state!=='connected');

  const cardFor=i=>
    '<div class="ig__c" data-state="'+i.state+'" data-openint="'+i.id+'">'+
      '<div class="ig__h">'+
        '<span class="ig__m" style="background:'+i.tone+'">'+esc(i.mark)+'</span>'+
        '<span class="ig__t"><b>'+esc(i.name)+'</b><span>'+esc(i.group)+'</span></span>'+
        pill(i.state)+
      '</div>'+
      '<p class="ig__w">'+esc(i.what)+'</p>'+
      '<div class="ig__f">'+
        (i.required?'<span class="req">Required</span>':'')+
        '<span class="meta">'+i.fields.filter(x=>x.secret).length+' server-side key'+
          (i.fields.filter(x=>x.secret).length===1?'':'s')+'</span>'+
      '</div>'+
    '</div>';

  return '<div class="mets">'+
      metric(on+'/'+INTEGRATIONS.length,'Connected')+
      metric(groups.length,'Categories')+
      metric(missing.length,'Required, not connected',
        missing.length?'blocks launch':'all set', missing.length?'down':'up')+
      metric(INTEGRATIONS.reduce((n,i)=>n+i.fields.filter(f=>f.secret).length,0),
        'Secrets in env vars')+
    '</div>'+

    (missing.length
      ? card('Blocking launch',
          missing.map(i=>'<div class="tl__r"><time>'+esc(i.group)+'</time>'+
            '<span><b>'+esc(i.name)+'</b> \u2014 '+esc(i.breaks)+'</span>'+
            '<button class="btn" data-v="primary" data-openint="'+i.id+'">Set up</button>'+
            '</div>').join(''))
      : '')+

    card(null,
      '<div class="tb">'+
        '<input type="search" data-tq="t-ig" value="'+esc(st.q)+'" placeholder="Search integrations">'+
        '<select data-tf="t-ig:group"><option value="">All categories</option>'+
          groups.map(g=>'<option'+(f===g?' selected':'')+'>'+esc(g)+'</option>').join('')+
        '</select>'+
        '<div class="tb__r"><span class="meta">'+list.length+' of '+INTEGRATIONS.length+'</span>'+
          (st.q||f?'<button class="btn" data-v="quiet" data-treset="t-ig">Clear</button>':'')+
        '</div></div>'+
      '<div style="padding:var(--s4)">'+
        (list.length ? '<div class="ig">'+list.map(cardFor).join('')+'</div>'
          : empty('No integrations match','Try a different category.'))+
      '</div>',
      {flush:true})+

    card('Where credentials live',
      '<div class="warn"><span>\u26A0</span><span><b>Secrets never belong in this panel.</b> '+
        'Anything entered in a browser sits in the DOM and in local storage, readable by '+
        'devtools or any injected script. Secret keys go in Vercel environment variables '+
        'and are read server-side only \u2014 this page shows whether they are present, '+
        'never their value.</span></div>'+
      '<div style="margin-top:var(--s3)">'+
        INTEGRATIONS.filter(i=>i.state==='connected')
          .flatMap(i=>i.fields.filter(f=>f.secret).map(f=>({i,f})))
          .map(({i,f})=>'<div class="keyrow"><div><b>'+esc(i.name)+'</b>'+
            '<code>'+esc(f.v)+'</code></div><span class="lock">env var</span></div>').join('')+
      '</div>',
      {sub:'Security'});
};

/* ---- Masters ------------------------------------------------ */
V.masters=()=>{
  const block=(key,m)=>{
    const use=MASTER_USE[key];
    return '<div class="ms__c">'+
      '<div class="ms__h"><b>'+esc(m.label)+'</b>'+
        (m.locked?'<span class="lock">system</span>':
          '<span class="meta">'+m.items.length+'</span>')+'</div>'+
      '<p class="ms__n">'+esc(m.note)+'</p>'+
      '<div class="ms__l">'+m.items.map(it=>{
        const n=use?use(it.id):null;
        return '<div class="ms__i">'+
          '<span style="color:var(--ink)">'+esc(it.name)+
            (it.detail?'<br><span>'+esc(it.detail)+'</span>':'')+'</span>'+
          '<span>'+(n===null?'':n+' in use')+'</span>'+
          (m.locked
            ? '<button disabled aria-label="System list">&times;</button>'
            : '<button data-delmaster="'+key+':'+it.id+'"'+(n?' disabled':'')+
              ' aria-label="Delete '+esc(it.name)+'"'+
              (n?' title="In use by '+n+' records"':'')+'>&times;</button>')+
        '</div>';
      }).join('')+'</div>'+
      (m.locked?'' :
        '<div class="ms__add">'+
          '<input placeholder="Add to '+esc(m.label.toLowerCase())+'" '+
            'data-mkey="'+key+'" aria-label="New '+esc(m.label)+'">'+
          '<button class="btn" data-v="outline" style="padding:6px 12px" '+
            'data-addmaster="'+key+'">Add</button></div>')+
    '</div>';
  };
  const editable=Object.entries(MASTERS).filter(([,m])=>!m.locked);
  const system=Object.entries(MASTERS).filter(([,m])=>m.locked);
  return card('Editable lists',
      '<div class="ms">'+editable.map(([k,m])=>block(k,m)).join('')+'</div>',
      {flush:false, sub:editable.length+' lists',
       foot:'<span class="meta">Deletion is blocked while records still reference an '+
            'entry \u2014 the count next to it is why. Rename with care: it re-labels '+
            'every event that uses it.</span>'})+
    card('System lists',
      '<div class="ms">'+system.map(([k,m])=>block(k,m)).join('')+'</div>',
      {sub:system.length+' lists',
       foot:'<span class="meta">Platform logic branches on these values. Changing one '+
            'is a database migration, not a settings edit, so they are read-only here.</span>'});
};

          'data-setrole="'+r.id+'">'+

        {key:'s',label:'Scopes',val:r=>ROLES[r.role].scopes.length,cls:'num',align:'right',
         cell:r=>ROLES[r.role].scopes.length+' of '+SCOPES.length},

    card('What each role can do',

        '</tr>').join('')+

      {flush:false,
       foot:'<span class="meta">Roles are scope sets, not job titles \u2014 "who can '+
            'issue a refund" has one answer you can point at. Enforced server-side in '+

/* ============================================================
   COMMAND PALETTE
   One index over sections, events, hosts and bookings. Ranked so an
   exact prefix beats a mid-string hit — typing "sun" should surface
   Sunrise 5K before Barsha Sunset Run.
   ============================================================ */
let CMDK={open:false, q:'', hi:0};

function cmdkIndex(){
  const out=[];
  NAV.forEach(g=>g[1].forEach(t=>
    out.push({label:t[1], kind:'Go to', hash:'#/'+t[0], key:t[1]})));
  EVENTS.forEach(e=>out.push({label:e.title, kind:'Event',
    sub:(host(e.host)||{}).name, hash:'#/events', open:['event',e.id], key:e.title}));
  HOSTS.forEach(h=>out.push({label:h.name, kind:'Host',
    sub:h.status, hash:'#/hosts', open:['host',h.id], key:h.name}));
  INTEGRATIONS.forEach(i=>out.push({label:i.name, kind:'Integration',
    sub:i.state, hash:'#/integrations', open:['integration',i.id], key:i.name+' '+i.group}));
  BOOKINGS.forEach(b=>out.push({label:b.who, kind:'Booking',
    sub:b.id, hash:'#/bookings', open:['booking',b.id], key:b.who+' '+b.id}));
  return out;
}

function cmdkHits(){
  const q=CMDK.q.trim().toLowerCase();
  const all=cmdkIndex();
  if(!q) return all.filter(x=>x.kind==='Go to');
  return all
    .map(x=>{
      const k=x.key.toLowerCase();
      const i=k.indexOf(q);
      if(i<0) return null;
      /* prefix beats word-start beats anywhere */
      const rank = i===0 ? 0 : (k[i-1]===' ' ? 1 : 2);
      return {...x, rank, i};
    })
    .filter(Boolean)
    .sort((a,b)=>a.rank-b.rank || a.i-b.i || a.label.localeCompare(b.label))
    .slice(0,12);
}

function cmdk(){
  if(!CMDK.open) return '<div class="cmdk" id="cmdk"></div>';
  const hits=cmdkHits();
  if(CMDK.hi>=hits.length) CMDK.hi=Math.max(0,hits.length-1);
  return '<div class="cmdk" id="cmdk" data-open="true" role="dialog" aria-modal="true">'+
    '<div class="cmdk__s" data-cmdkclose></div>'+
    '<div class="cmdk__p">'+
      '<input class="cmdk__i" id="cmdki" placeholder="Search events, hosts, bookings\u2026" '+
        'value="'+esc(CMDK.q)+'" autocomplete="off" aria-label="Command palette">'+
      '<div class="cmdk__l">'+
        (hits.length ? hits.map((x,i)=>
          '<a href="#" data-cmdk="'+i+'" data-hi="'+(i===CMDK.hi)+'">'+
            '<span>'+esc(x.label)+(x.sub?' <span class="meta">'+esc(x.sub)+'</span>':'')+'</span>'+
            '<small>'+esc(x.kind)+'</small></a>').join('')
          : '<a data-hi="false"><span class="meta">No matches</span></a>')+
      '</div>'+
      '<div style="padding:8px var(--s4);border-top:1px solid var(--line)">'+
        '<span class="meta">\u2191\u2193 move \u00b7 \u21B5 open \u00b7 esc close</span></div>'+
    '</div></div>';
}

function cmdkGo(i){
  const hits=cmdkHits();
  const x=hits[i];
  if(!x) return;
  CMDK.open=false; CMDK.q=''; CMDK.hi=0;
  if(x.open){ DRAWER=x.open; }
  if(location.hash!==x.hash){ location.hash=x.hash; }
  render();
}
