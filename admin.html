/* Inputs carrying data-cms write into the store on change, so
   there is no save button to forget. */
function wire(){
  document.querySelectorAll('[data-cms]').forEach(el=>{
    if(el.dataset.bound) return;
    el.dataset.bound='1';
    el.addEventListener('change',()=>{
      const path=el.dataset.cms.split('.');
      let n=CMS; while(path.length>1) n=n[path.shift()];
      n[path[0]] = el.type==='number' ? (+el.value||0) : el.value;
      saveCms(); logIt('Edited '+el.dataset.cms, String(el.value).slice(0,40));
    });
  });
  const col=$('cm-color');
  if(col && !col.dataset.bound){
    col.dataset.bound='1';
    col.addEventListener('input',()=>{
      setBrand(col.value);
      const o=$('hexout'); if(o) o.textContent=col.value.toUpperCase();
    });
    col.addEventListener('change',()=>{ saveCms(); logIt('Changed brand colour',col.value); });
  }
  /* table search is debounced through the same state object the
     view reads, so a re-render never loses what was typed */
  document.querySelectorAll('[data-tq]').forEach(el=>{
    if(el.dataset.bound) return;
    el.dataset.bound='1';
    el.addEventListener('input',()=>{
      tstate(el.dataset.tq).q=el.value;
      clearTimeout(el._t);
      el._t=setTimeout(()=>{ render();
        const again=document.querySelector('[data-tq="'+el.dataset.tq+'"]');
        if(again){ again.focus(); again.setSelectionRange(again.value.length,again.value.length); }
      },180);
    });
  });
  document.querySelectorAll('[data-setrole]').forEach(el=>{
    if(el.dataset.bound) return;
    el.dataset.bound='1';
    el.addEventListener('change',()=>{
      const a=ADMINS.find(x=>x.id===el.dataset.setrole);
      if(!a) return;
      a.role=el.value;
      logIt('Changed role', a.name+' \u2192 '+ROLES[a.role].label);
      toast(a.name+' is now '+ROLES[a.role].label);
      render();
    });
  });
  document.querySelectorAll('[data-tf]').forEach(el=>{
    if(el.dataset.bound) return;
    el.dataset.bound='1';
    el.addEventListener('change',()=>{
      const [id,key]=el.dataset.tf.split(':');
      tstate(id).filters[key]=el.value;
      render();
    });
  });
  const gq=$('gq');
  if(gq && !gq.dataset.bound){
    gq.dataset.bound='1';
    /* the top-bar field is an entry point to the palette, not a
       second search with different rules */
    gq.addEventListener('focus',()=>{ CMDK.open=true; CMDK.q=gq.value; render(); });
  }
  const ci=$('cmdki');
  if(ci && !ci.dataset.bound){
    ci.dataset.bound='1';
    ci.focus();
    ci.setSelectionRange(ci.value.length, ci.value.length);
    ci.addEventListener('input',()=>{
      CMDK.q=ci.value; CMDK.hi=0; render();
    });
  }
}

document.addEventListener('click', e=>{
  const t=e.target;

  if(t.closest('#dologin')){
    SESSION={authed:true,who:'admin@kreo.ae'}; Store.write(LS.session,SESSION);
    location.hash='#/overview'; render(); toast('Signed in'); return;
  }
  if(t.closest('#logout')){
    e.preventDefault();
    SESSION={authed:false}; Store.clear(LS.session); render(); toast('Signed out'); return;
  }

  /* sorting */
  const th=t.closest('th[data-sort]');
  if(th){
    const st=tstate(th.dataset.table);
    if(st.sort===th.dataset.sort) st.dir = st.dir==='asc' ? 'desc' : 'asc';
    else { st.sort=th.dataset.sort; st.dir='asc'; }
    render(); return;
  }

  /* selection */
  const cb=t.closest('input[data-row]');
  if(cb){
    e.stopPropagation();
    const st=tstate(cb.dataset.row);
    cb.checked ? st.sel.add(cb.value) : st.sel.delete(cb.value);
    render(); return;
  }
  const all=t.closest('input[data-all]');
  if(all){
    e.stopPropagation();
    const id=all.dataset.all, st=tstate(id);
    const ids=[...document.querySelectorAll('input[data-row="'+id+'"]')].map(x=>x.value);
    all.checked ? ids.forEach(i=>st.sel.add(i)) : ids.forEach(i=>st.sel.delete(i));
    render(); return;
  }
  const cs=t.closest('[data-clearsel]');
  if(cs){ tstate(cs.dataset.clearsel).sel.clear(); render(); return; }

  const bulk=t.closest('[data-bulk]');
  if(bulk){
    const [id,action]=bulk.dataset.bulk.split(':');
    const st=tstate(id);
    const ids=[...st.sel];
    const n=ids.length;
    if(!n){ toast('Nothing selected'); return; }
    let verb='';

    if(action==='unpublish'){
      ids.forEach(i=>{ const x=ev(i); if(x) x.status='draft'; });
      verb='Unpublished events';
    }
    if(action==='publish'){
      ids.forEach(i=>{ const x=ev(i); if(x) x.status='live'; });
      verb='Published events';
    }
    if(action==='feature'){
      /* toggle: selecting an already-featured set should clear it,
         otherwise there is no way to un-feature in bulk */
      const allOn=ids.every(i=>OPS.featured.includes(i));
      OPS.featured = allOn
        ? OPS.featured.filter(i=>!ids.includes(i))
        : [...new Set([...OPS.featured, ...ids])];
      verb = allOn ? 'Un-featured events' : 'Featured events';
    }
    if(action==='suspend'){
      ids.forEach(i=>{ const h=host(i); if(h && h.status!=='pending') h.status='suspended'; });
      verb='Suspended hosts';
    }
    if(action==='approve'){
      ids.forEach(i=>{ const h=host(i); if(h){ h.status='active'; h.verified=true; } });
      verb='Approved hosts';
    }

    pushOps();
    logIt(verb, n+' selected');
    st.sel.clear();
    toast(n+' updated');
    render(); return;
  }

  const mf=t.closest('[data-mfa]');
  if(mf){ const a=ADMINS.find(x=>x.id===mf.dataset.mfa);
    if(a){ a.mfa=true; logIt('Required MFA', a.name); toast('MFA required for '+a.name);
      render(); } return; }
  const rv=t.closest('[data-revoke]');
  if(rv){ const i=ADMINS.findIndex(x=>x.id===rv.dataset.revoke);
    if(i>-1){ const a=ADMINS[i];
      if(a.role==='owner'){ toast('Owners cannot be revoked here'); return; }
      ADMINS.splice(i,1); logIt('Revoked admin access', a.name);
      toast(a.name+' removed'); render(); } return; }
  if(t.closest('[data-invite]')){
    const em=prompt('Email address to invite');
    if(em && em.includes('@')){
      ADMINS.push({id:'a'+Date.now(), name:em.split('@')[0], email:em,
        role:'viewer', last:new Date().toISOString(), mfa:false});
      logIt('Invited admin', em); toast('Invite sent as Read only'); render();
    }
    return;
  }

  /* masters */
  const dm2=t.closest('[data-delmaster]');
  if(dm2){
    const [k,id]=dm2.dataset.delmaster.split(':');
    const m=MASTERS[k]; if(!m) return;
    const i=m.items.findIndex(x=>x.id===id);
    if(i>-1){ const nm=m.items[i].name; m.items.splice(i,1);
      logIt('Removed master', m.label+' \u00b7 '+nm); toast(nm+' removed'); render(); }
    return;
  }
  const am=t.closest('[data-addmaster]');
  if(am){
    const k=am.dataset.addmaster;
    const el=document.querySelector('[data-mkey="'+k+'"]');
    const v=(el && el.value || '').trim();
    if(!v){ toast('Type a name first'); return; }
    const m=MASTERS[k];
    const id=v.toLowerCase().replace(/[^a-z0-9]+/g,'-');
    if(m.items.some(x=>x.id===id)){ toast('That already exists'); return; }
    m.items.push({id,name:v});
    logIt('Added master', m.label+' \u00b7 '+v); toast(v+' added'); render();
    return;
  }

  const sv=t.closest('[data-saveview]');
  if(sv){
    const id=sv.dataset.saveview;
    const n=prompt('Name this view', 'Untitled view');
    if(n && n.trim()){ saveView(id, n.trim());
      logIt('Saved view', n.trim()); toast('View saved'); render(); }
    return;
  }
  const uv=t.closest('[data-useview]');
  if(uv){ const [id,i]=uv.dataset.useview.split(':'); applyView(id,+i); render(); return; }
  const dv=t.closest('[data-dropview]');
  if(dv){ const [id,i]=dv.dataset.dropview.split(':'); dropView(id,+i); render(); return; }

  const tr=t.closest('[data-treset]');
  if(tr){ const st=tstate(tr.dataset.treset); st.q=''; st.filters={}; render(); return; }

  /* drawer */
  const row=t.closest('[data-open]');
  if(row && !t.closest('input') && !t.closest('button') && !t.closest('a')){
    DRAWER=row.dataset.open.split(':').slice(-2);
    const parts=row.dataset.open.split(':');
    DRAWER=[parts[0].startsWith('t-')?'event':parts[0], parts[1]];
    if(parts[0]==='t-bk') DRAWER=['booking',parts[1]];
    if(parts[0]==='t-h')  DRAWER=['host',parts[1]];
    if(parts[0]==='t-ev'||parts[0]==='t-soon') DRAWER=['event',parts[1]];
    render(); return;
  }
  if(t.closest('[data-dwclose]')){ DRAWER=null; render(); return; }

  const oh=t.closest('[data-openhost]');
  if(oh){ DRAWER=['host', oh.dataset.openhost]; render(); return; }
  const oe=t.closest('[data-openev]');
  if(oe){ DRAWER=['event', oe.dataset.openev]; render(); return; }

  const oi=t.closest('[data-openint]');
  if(oi){ DRAWER=['integration', oi.dataset.openint]; render(); return; }
  const ion=t.closest('[data-integon]');
  if(ion){
    const i=integ(ion.dataset.integon);
    if(i){
      /* A required integration cannot be "connected" from a browser —
         it needs its env vars set and a deploy. Say so plainly. */
      i.state='connected'; saveIntegrations();
      logIt('Connected integration', i.name);
      toast(i.fields.some(f=>f.secret)
        ? i.name+' marked connected \u2014 set its env vars and redeploy'
        : i.name+' connected');
      DRAWER=null; render();
    }
    return;
  }
  const ioff=t.closest('[data-integoff]');
  if(ioff){
    const i=integ(ioff.dataset.integoff);
    if(i){ i.state='available'; saveIntegrations();
      logIt('Disconnected integration', i.name);
      toast(i.name+' disconnected'); DRAWER=null; render(); }
    return;
  }

  if(t.closest('[data-cmdkclose]')){ CMDK.open=false; CMDK.q=''; render(); return; }
  const ck=t.closest('[data-cmdk]');
  if(ck){ e.preventDefault(); cmdkGo(+ck.dataset.cmdk); return; }

  /* moderation */
  const ap=t.closest('[data-approve]');
  if(ap){ const h=host(ap.dataset.approve);
    if(h){ h.status='active'; h.verified=true; pushOps(); logIt('Approved host',h.name);
      toast(h.name+' approved'); DRAWER=null; render(); } return; }
  const rj=t.closest('[data-reject]');
  if(rj){ const h=host(rj.dataset.reject);
    if(h){ h.status='rejected'; pushOps(); logIt('Rejected host',h.name);
      toast(h.name+' rejected'); DRAWER=null; render(); } return; }
  const sp=t.closest('[data-suspend]');
  if(sp){ const h=host(sp.dataset.suspend);
    if(h){ const was=h.status==='suspended'; h.status=was?'active':'suspended';
      pushOps(); logIt(was?'Reinstated host':'Suspended host',h.name);
      toast(h.name+(was?' reinstated':' suspended')); DRAWER=null; render(); } return; }

  const pe=t.closest('[data-pubev]');
  if(pe){ const x=ev(pe.dataset.pubev);
    if(x){ x.status='live'; pushOps(); logIt('Published event',x.title);
      toast(x.title+' is live'); DRAWER=null; render(); } return; }
  const re=t.closest('[data-rejev]');
  if(re){ const x=ev(re.dataset.rejev);
    if(x){ x.status='draft'; pushOps(); logIt('Rejected event',x.title);
      toast(x.title+' sent back'); DRAWER=null; render(); } return; }
  const up=t.closest('[data-unpub]');
  if(up){ const x=ev(up.dataset.unpub);
    if(x){ const was=x.status==='live'; x.status=was?'draft':'live';
      pushOps(); logIt(was?'Unpublished event':'Published event',x.title);
      toast(x.title+(was?' unpublished':' published')); DRAWER=null; render(); } return; }

  const rf=t.closest('[data-refund]');
  if(rf){ const b=BOOKINGS.find(x=>x.id===rf.dataset.refund);
    if(b){ b.status='refunded'; logIt('Issued refund',b.id+' \u00b7 '+aed(b.total));
      toast('Refunded '+aed(b.total)); DRAWER=null; render(); } return; }

  /* content */
  const dw2=t.closest('[data-delword]');
  if(dw2){ CMS.hero.words.splice(+dw2.dataset.delword,1);
    if(!CMS.hero.words.length) CMS.hero.words.push('creativity');
    saveCms(); logIt('Removed hero word','hero'); render(); return; }
  if(t.closest('#addword')){
    const el=$('cm-word'); const v=(el&&el.value||'').trim();
    if(!v){ toast('Type a word first'); return; }
    CMS.hero.words.push(v); saveCms(); logIt('Added hero word',v); render(); return;
  }
  const fb=t.closest('[data-font]');
  if(fb){
    setFonts(fb.dataset.font); saveCms();
    logIt('Changed typeface', (FONTSETS[fb.dataset.font]||{}).label||fb.dataset.font);
    render(); return;
  }

  const swb=t.closest('[data-swatch]');
  if(swb){ setBrand(swb.dataset.swatch); saveCms();
    logIt('Changed brand colour',swb.dataset.swatch); render(); return; }
  if(t.closest('#resetcolor')){ setBrand(DEFAULT_CMS.brandColor); saveCms();
    logIt('Reset brand colour',DEFAULT_CMS.brandColor); render(); return; }
  if(t.closest('#exportcms')){
    const j=JSON.stringify(CMS,null,2);
    if(navigator.clipboard && window.isSecureContext)
      navigator.clipboard.writeText(j).then(()=>toast('Copied'),()=>toast('Copy failed'));
    else toast('Clipboard needs HTTPS');
    return;
  }
  if(t.closest('#resetcms')){
    Object.assign(CMS,structuredClone(DEFAULT_CMS)); setBrand(CMS.brandColor);
    saveCms(); logIt('Reset all settings','defaults'); toast('Reset'); render(); return;
  }
  const ex=t.closest('[data-export]');
  if(ex){
    const spec=EXPORTS[ex.dataset.export];
    if(!spec){ toast('Nothing to export'); return; }
    const {name,cols,rows}=spec();
    if(!rows.length){ toast('No rows match the current filters'); return; }
    const ok=download(name, toCsv(cols,rows));
    if(ok){ logIt('Exported CSV', name+' \u00b7 '+rows.length+' rows');
      toast(rows.length+' rows exported'); }
    else toast('Download blocked by the browser');
    return;
  }
  const tt=t.closest('[data-toast]');
  if(tt){ toast(tt.dataset.toast); return; }
});

document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    CMDK.open=!CMDK.open; CMDK.q=''; CMDK.hi=0; render();
    return;
  }
  if(CMDK.open){
    const n=cmdkHits().length;
    if(e.key==='Escape'){ e.preventDefault(); CMDK.open=false; CMDK.q=''; render(); return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); CMDK.hi=(CMDK.hi+1)%Math.max(1,n); render(); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); CMDK.hi=(CMDK.hi-1+n)%Math.max(1,n); render(); return; }
    if(e.key==='Enter'){ e.preventDefault(); cmdkGo(CMDK.hi); return; }
    return;
  }
  if(e.key==='Escape' && DRAWER){ DRAWER=null; render(); }
});

/* ============================================================
   THEME — same contract as the public site
   ============================================================ */
const THEME={
  read(){ try{return localStorage.getItem(LS.theme);}catch(e){return null;} },
  write(v){ try{localStorage.setItem(LS.theme,v);}catch(e){} },
  apply(v){
    document.documentElement.dataset.theme=v;
    const b=$('theme');
    if(b){ b.innerHTML = v==='dark'?'&#9788;':'&#9789;';
      b.setAttribute('aria-pressed',String(v==='dark')); }
    const m=document.querySelector('meta[name=theme-color]');
    if(m) m.setAttribute('content', v==='dark'?'#0D0C0B':'#FFFFFF');
  },
  init(){
    this.apply(this.read() || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
    document.addEventListener('click',e=>{
      if(!e.target.closest('#theme')) return;
      const n=document.documentElement.dataset.theme==='dark'?'light':'dark';
      this.write(n); this.apply(n);
    });
  }
};

/* Adopt overrides written by an earlier session so the console and
   the public site never disagree about what is live. */
Object.entries(OPS.events||{}).forEach(([id,st])=>{ const e=ev(id); if(e) e.status=st; });
Object.entries(OPS.hosts||{}).forEach(([id,st])=>{ const h=host(id); if(h) h.status=st; });

setBrand(CMS.brandColor);
setFonts(CMS.fonts||'brand');
window.addEventListener('hashchange',()=>{ DRAWER=null; render(); });
render();
THEME.init();

</script>
