/* ============================================================
   ROUTER
   ============================================================ */
/* Route guards. Host screens fall back to the gate (which sells
   hosting) rather than a 403; attendee screens fall back to login. */
const HOST_ONLY = ['dashboard','analytics','reach','attendees','create','reviews','discounts'];
const AUTH_ONLY = ['mine','ticket','profile','book','alerts'];

function route(){
  const raw=(location.hash||'#/home').slice(2);
  const [name,arg]=raw.split('/');
  let fn=views[name]||views.home, shown=name;

  if(HOST_ONLY.includes(name) && DB.session.role!=='host'){ fn=views.gate; shown='gate'; }
  else if(AUTH_ONLY.includes(name) && !DB.session.authed){ fn=views.login; shown='login'; }

  app().innerHTML = fn(arg);
  window.scrollTo(0,0);
  mark(shown);
  applyRole();
  updateBadge();
  if(shown==='book') recalc();
  if(shown==='search') wireSearch();
  if(shown==='map') setTimeout(initMap,0);
  if(shown==='event') setTimeout(initEventMap,0);
}

/* Nav reflects the session. "Host an event" is never hidden —
   hiding it would close the only door a new organiser can find. */
function updateBadge(){
  const b=document.getElementById('badge');
  if(!b) return;
  const n=DB.notifications.filter(x=>!x.read).length;
  b.textContent=n; b.style.display=n?'grid':'none';
}

function applyRole(){
  const {authed, role} = DB.session;
  document.querySelectorAll('[data-auth]').forEach(el=>{
    el.style.display = authed ? '' : 'none';
  });
  document.querySelectorAll('[data-host]').forEach(el=>{
    el.style.display = role==='host' ? '' : 'none';
  });
  const btn=document.getElementById('authbtn');
  const acct=document.getElementById('acct');
  if(acct) acct.textContent = DB.me.initials;
  if(!btn) return;
  /* signed out: one clear entry. signed in: the CTA becomes the
     next useful action and identity moves into the avatar menu. */
  btn.style.display = authed ? '' : '';
  if(role==='host'){ btn.textContent='Create event'; btn.setAttribute('href','#/create'); }
  else if(authed){  btn.textContent='Host an event'; btn.setAttribute('href','#/gate'); }
  else {            btn.textContent='Sign in';       btn.setAttribute('href','#/login'); }
}

function mark(name){
  document.querySelectorAll('#topnav a, #tabbar a').forEach(a=>{
    const target=a.getAttribute('href').slice(2).split('/')[0];
    const on = target===name
      /* the landing page is not a nav destination — nothing should
         read as current while you are on it */
      || (target==='discover' && ['event','brand','book'].includes(name))
      || (target==='mine' && name==='ticket')
      || (target==='search' && name==='map')
      || (target==='dashboard' &&
          ['analytics','reach','attendees','reviews','discounts','create'].includes(name));
    on ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current');
  });
}

function runSearch(){
  const out=document.getElementById('results');
  if(!out) return;
  const val = id => { const el=document.getElementById(id); return el?el.value:''; };
  const seg = sel => {
    const b=document.querySelector(sel+' button[aria-pressed="true"]');
    if(!b) return 0;
    return parseInt(b.dataset.cost ?? b.dataset.avail ?? 0,10);
  };

  const q=(val('q')||'').trim().toLowerCase();
  const city=val('f-city'), cat=val('f-cat');
  const from=val('f-from'), to=val('f-to');
  const cost=seg('#cost'), avail=seg('#avail');

  const hits=DB.events.filter(e=>{
    const b=brand(e.brand_id);
    /* full-text across every field a person might type */
    if(q){
      const hay=(e.title+' '+b.name+' '+e.location_name+' '+e.address+' '+
                 e.category+' '+e.tags.join(' ')+' '+e.about).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(city && e.city!==city) return false;
    if(cat && e.category!==cat) return false;

    const day=F.day(e.start_at).key;
    if(from && day<from) return false;
    if(to   && day>to)   return false;

    if(cost===1 && e.price_cents!==0) return false;
    if(cost===2 && !(e.price_cents>0 && e.price_cents<15000)) return false;
    if(cost===3 && e.price_cents<15000) return false;

    const st=F.state(e);
    if(avail===1 && st==='soldout') return false;
    if(avail===2 && st!=='limited') return false;
    if(avail===3 && st!=='soldout') return false;
    return true;
  });

  const n=document.getElementById('rcount');
  if(n) n.textContent = hits.length+' event'+(hits.length===1?'':'s');
  out.className = hits.length ? 'results reveal' : '';
  out.innerHTML = hits.length ? hits.map(e=>card(e,'tile')).join('')
    : emptyState('Nothing matches those filters','Clear a filter or widen the date range.');
}

function wireSearch(){
  ['q','f-city','f-cat','f-from','f-to'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.addEventListener(id==='q'?'input':'change',runSearch);
  });
}

/* ============================================================
   DELEGATED EVENTS — one listener, survives every re-render
   ============================================================ */
document.addEventListener('click',ev=>{

  const back=ev.target.closest('[data-back]');
  if(back){ history.back(); return; }

  const save=ev.target.closest('[data-save]');
  if(save){
    ev.preventDefault(); ev.stopPropagation();
    const id=save.dataset.save, on=DB.saved.has(id);
    on ? DB.saved.delete(id) : DB.saved.add(id);
    save.setAttribute('aria-pressed',String(!on));
    save.innerHTML = on ? '&#9825;' : '&#9829;';
    toast(on?'Removed from saved':'Saved');
    return;
  }

  const cat=ev.target.closest('[data-cat]');
  if(cat){ filter=cat.dataset.cat; route(); return; }

  const qty=ev.target.closest('[data-qty]');
  if(qty){
    const e=event_(location.hash.split('/')[2]);
    const ss=DB.sessions[e.id]||[{capacity:e.capacity,booked:e.booked_count}];
    const left=ss[CART.sess].capacity-ss[CART.sess].booked;
    CART.qty=Math.max(1,Math.min(10,Math.min(CART.qty+ +qty.dataset.qty,left)));
    recalc();
    return;
  }

  const confirm=ev.target.closest('[data-confirm]');
  if(confirm){
    const e=event_(confirm.dataset.confirm);
    const tiers=DB.tiers[e.id]||[{price_cents:e.price_cents,name:'Standard'}];
    const t=tiers[CART.tier]||tiers[0];
    const sub=t.price_cents*CART.qty;
    const disc=CART.promo?Math.round(sub*CART.promo.pct/100):0;
    const spent=CART.pay==='credits'?Math.min(DB.me.credits,sub-disc):0;
    if(spent){ DB.me.credits-=spent;
      DB.ledger.unshift({t:'Spent on '+e.title,v:spent,dir:'out',d:F.day(new Date().toISOString()).key}); }
    if(CART.promo) CART.promo.uses++;

    const id='bk_'+Math.random().toString(36).slice(2,6).toUpperCase();
    const ss=DB.sessions[e.id];
    DB.bookings.push({id,event_id:e.id,qty:CART.qty,tier:t.name,
      paid_cents:Math.max(0,sub-disc-spent),status:'confirmed',
      created_at:new Date().toISOString()});
    e.booked_count=Math.min(e.capacity,e.booked_count+CART.qty);
    if(ss&&ss[CART.sess]) ss[CART.sess].booked+=CART.qty;

    DB.notifications.unshift({id:'n'+Date.now(),type:'booking',title:'Booking confirmed',
      body:'Your ticket for '+e.title+' is ready. QR code inside.',
      at:new Date().toISOString(),read:false,link:'#/ticket/'+id});
    updateBadge();

    CART.promo=null; CART.qty=1;
    toast('Confirmed \u2014 ticket and email sent');
    location.hash='#/ticket/'+id;
    return;
  }

  const can=ev.target.closest('[data-cancel]');
  if(can){
    const id=can.dataset.cancel;
    const i=DB.bookings.findIndex(b=>b.id===id);
    if(i>-1){
      const bk=DB.bookings[i], e=event_(bk.event_id);
      e.booked_count=Math.max(0,e.booked_count-bk.qty);
      DB.bookings.splice(i,1);
      if(DB.waitlist.size){
        DB.notifications.unshift({id:'n'+Date.now(),type:'waitlist',title:'A seat opened up',
          body:'Someone cancelled. First to book takes the seat.',
          at:new Date().toISOString(),read:false,link:'#/discover'});
      }
      updateBadge();
      toast('Cancelled \u2014 seat released, waitlist notified');
      location.hash='#/mine';
    }
    return;
  }

  /* city picker */
  const pb=ev.target.closest('#pickbtn');
  if(pb){
    const pnl=document.getElementById('pickpanel');
    const open=pnl.dataset.open!=='true';
    pnl.dataset.open=String(open);
    pb.setAttribute('aria-expanded',String(open));
    return;
  }
  const rg=ev.target.closest('[data-region]');
  if(rg){ REGION=rg.dataset.region; route();
    setTimeout(()=>{const p=document.getElementById('pickpanel');
      if(p){p.dataset.open='true';
        document.getElementById('pickbtn').setAttribute('aria-expanded','true');}},0);
    return; }
  const ct=ev.target.closest('[data-city]');
  if(ct){
    CITY=ct.dataset.city;
    const c=DB.cities.find(x=>x.slug===CITY);
    if(c){ GEO.here={lat:c.lat,lng:c.lng,label:c.label,exact:false}; }
    toast('Showing '+(c?c.label:CITY));
    route(); return;
  }
  if(!ev.target.closest('.pick')){
    const pnl=document.getElementById('pickpanel');
    if(pnl && pnl.dataset.open==='true'){ pnl.dataset.open='false';
      const b=document.getElementById('pickbtn'); if(b) b.setAttribute('aria-expanded','false'); }
  }

  /* checkout controls */
  const sl=ev.target.closest('[data-sess]');
  if(sl){ CART.sess=+sl.dataset.sess; CART.qty=1; route(); return; }
  const tr=ev.target.closest('[data-tier]');
  if(tr){ CART.tier=+tr.dataset.tier; route(); return; }
  const pm=ev.target.closest('[data-pay]');
  if(pm){
    CART.pay=pm.dataset.pay;
    document.querySelectorAll('[data-pay]').forEach(x=>
      x.setAttribute('aria-pressed',String(x===pm)));
    recalc(); return;
  }
  const pr=ev.target.closest('[data-promo]');
  if(pr){
    const v=(document.getElementById('promo').value||'').trim().toUpperCase();
    const d=DB.discounts.find(x=>x.code===v && x.active && x.uses<x.cap);
    if(d){ CART.promo=d; toast(d.pct+'% off applied'); route(); }
    else { CART.promo=null; toast(v?'Code not valid':'Enter a code'); recalc(); }
    return;
  }

  /* notifications */
  const nt=ev.target.closest('[data-notif]');
  if(nt){
    const n=DB.notifications.find(x=>x.id===nt.dataset.notif);
    if(n){ n.read=true; nt.dataset.read='true'; updateBadge(); }
    return;
  }
  const ra=ev.target.closest('[data-readall]');
  if(ra){ DB.notifications.forEach(n=>n.read=true); toast('All marked read'); route(); return; }
  const pf=ev.target.closest('[data-pref]');
  if(pf){ DB.prefs[pf.dataset.pref]=pf.checked; return; }

  /* reviews */
  const rp=ev.target.closest('[data-reply]');
  if(rp){
    const id=rp.dataset.reply;
    const box=document.getElementById('rep-'+id);
    const txt=(box&&box.value||'').trim();
    if(!txt){ toast('Write a reply first'); return; }
    const r=DB.reviews.find(x=>x.id===id);
    if(r){ r.reply=txt; toast('Reply posted'); route(); }
    return;
  }

  /* discount codes */
  const gc=ev.target.closest('[data-gencode]');
  if(gc){
    const v=(document.getElementById('dc-code').value||'').trim().toUpperCase();
    const code=v||('KREO'+Math.random().toString(36).slice(2,6).toUpperCase());
    if(DB.discounts.some(d=>d.code===code)){ toast('That code already exists'); return; }
    DB.discounts.unshift({code, pct:+document.getElementById('dc-pct').value||10,
      uses:0, cap:+document.getElementById('dc-cap').value||50,
      expires:document.getElementById('dc-exp').value||'2026-12-31', active:true});
    toast(code+' created'); route(); return;
  }
  const cc=ev.target.closest('[data-copycode]');
  if(cc){
    const t=cc.dataset.copycode;
    if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).catch(()=>{});
    toast(t+' copied'); return;
  }

  const dm=ev.target.closest('[data-demo]');
  if(dm){ document.getElementById('demo').dataset.off='true'; return; }

  const loc=ev.target.closest('[data-locate]');
  if(loc){ locate(); return; }

  const clr=ev.target.closest('[data-clear]');
  if(clr){
    ['q','f-city','f-cat','f-from','f-to'].forEach(id=>{
      const el=document.getElementById(id); if(el) el.value='';
    });
    document.querySelectorAll('#cost button, #avail button').forEach((b,i)=>
      b.setAttribute('aria-pressed', String(b.dataset.cost==='0'||b.dataset.avail==='0')));
    runSearch();
    return;
  }

  const am=ev.target.closest('#acct');
  if(am){
    const m=document.getElementById('acctmenu');
    const open=m.dataset.open!=='true';
    m.dataset.open=String(open);
    am.setAttribute('aria-expanded',String(open));
    return;
  }
  if(!ev.target.closest('#acctmenu')){
    const m=document.getElementById('acctmenu');
    if(m && m.dataset.open==='true'){ m.dataset.open='false';
      document.getElementById('acct').setAttribute('aria-expanded','false'); }
  }

  const lg=ev.target.closest('[data-login]');
  if(lg){
    const r=lg.dataset.login;
    DB.session={authed:true, role:r, brand_id: r==='host'?'b4':null};
    toast(r==='host'?'Signed in as Studio Quoz':'Signed in');
    location.hash = r==='host' ? '#/dashboard' : '#/discover';
    applyRole();
    return;
  }

  const so=ev.target.closest('[data-logout]');
  if(so){
    const m=document.getElementById('acctmenu'); if(m) m.dataset.open='false';
    DB.session={authed:false, role:'guest', brand_id:null};
    toast('Signed out');
    location.hash='#/home'; route();
    return;
  }

  /* share sheet */
  const sh=ev.target.closest('[data-open-share]');
  if(sh){
    ev.preventDefault();
    const e=event_(sh.dataset.openShare);
    SHEET.open(e ? e.title : 'KREO', 'https://kreo.ae/e/'+(e?e.id:''));
    return;
  }
  const sc=ev.target.closest('[data-sheet=close]');
  if(sc || ev.target.id==='sheet'){ SHEET.close(); return; }
  const sb=ev.target.closest('[data-share]');
  if(sb){ SHEET.send(sb.dataset.share); return; }

  const w=ev.target.closest('[data-wait]');
  if(w){
    const id=w.dataset.wait, on=DB.waitlist.has(id);
    on?DB.waitlist.delete(id):DB.waitlist.add(id);
    w.textContent = on?'Join waitlist':'On the waitlist';
    w.dataset.v = on?'ink':'quiet';
    if(!on){
      DB.notifications.unshift({id:'n'+Date.now(),type:'waitlist',title:'You joined the waitlist',
        body:'We will alert you the moment a seat opens for '+event_(id).title+'.',
        at:new Date().toISOString(),read:false,link:'#/event/'+id});
      updateBadge();
    }
    toast(on?'Left the waitlist':'On the waitlist \u2014 we\u2019ll alert you if a seat opens');
    return;
  }

  const intr=ev.target.closest('[data-interest]');
  if(intr){
    const k=intr.dataset.interest, i=DB.me.interests.indexOf(k);
    i>-1?DB.me.interests.splice(i,1):DB.me.interests.push(k);
    intr.setAttribute('aria-pressed',String(i===-1));
    toast(i>-1?'Removed':'Added to your interests');
    return;
  }

  /* generic segmented control: one pressed per group */
  const seg=ev.target.closest('.seg button');
  if(seg){
    seg.parentElement.querySelectorAll('button')
      .forEach(x=>x.setAttribute('aria-pressed',String(x===seg)));
    if(seg.dataset.cost!==undefined||seg.dataset.avail!==undefined) runSearch();
    return;
  }

  const chk=ev.target.closest('[data-checkin]');
  if(chk){
    const row=chk.closest('.att__r')||chk.closest('.roster__r');
    if(row && row.classList.contains('att__r')){
      const eid=location.hash.split('/')[2];
      const list=DB.attendees[eid]; const a=list&&list[+chk.dataset.checkin];
      if(a) a.in=!a.in;
    }
    const on=row.dataset.in==='true';
    row.dataset.in=String(!on);
    chk.textContent = on ? 'Check in' : 'Checked in';
    chk.dataset.v  = on ? 'ink' : 'quiet';
    toast(on?'Check-in undone':'Checked in');
    return;
  }

  const fol=ev.target.closest('[data-follow]');
  if(fol){
    const id=fol.dataset.follow, on=DB.follows.has(id);
    on ? DB.follows.delete(id) : DB.follows.add(id);
    const city = id==='city';
    fol.textContent = on ? (city?'Subscribe':'Follow') : (city?'Subscribed':'Following');
    fol.dataset.v  = on ? (city?'primary':'outline') : 'quiet';
    toast(on ? 'Unsubscribed' : (city?'Subscribed to Dubai':'Following'));
    return;
  }

  const t=ev.target.closest('[data-toast]');
  if(t){ toast(t.dataset.toast); return; }
});

/* ============================================================
   MAP — Leaflet + OpenStreetMap. No API key, no billing.
   Swapping to Google later means replacing initMap() only.
   ============================================================ */
let MAP=null;
function initMap(){
  const el=document.getElementById('map');
  if(!el) return;
  if(typeof L==='undefined'){
    el.innerHTML='<div class="empty" style="height:100%;display:grid;place-content:center">'+
      '<p class="h3">Map unavailable offline</p>'+
      '<p class="body">The map library could not load. Everything else still works.</p></div>';
    return;
  }
  if(MAP){ MAP.remove(); MAP=null; }
  MAP=L.map(el,{scrollWheelZoom:false}).setView([GEO.here.lat,GEO.here.lng],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:18, attribution:'&copy; OpenStreetMap contributors'
  }).addTo(MAP);

  const group=[];
  DB.events.forEach(e=>{
    const free=e.price_cents===0;
    const icon=L.divIcon({html:'<div class="pin" data-free="'+free+'"><b>'+
      (free?'FREE':(e.price_cents/100))+'</b></div>',
      className:'', iconSize:[34,34], iconAnchor:[17,34]});
    const m=L.marker([e.lat,e.lng],{icon,title:e.title}).addTo(MAP);
    m.bindPopup('<div class="pop"><img src="'+IMG+e.cover+'?w=300&q=65" alt="">'+
      '<p style="margin:0;font-weight:700">'+esc(e.title)+'</p>'+
      '<p style="margin:2px 0 6px;font-size:12px;color:#6B665E">'+
        F.day(e.start_at).long+' \u00b7 '+F.time(e.start_at)+'</p>'+
      '<a href="#/event/'+e.id+'" style="font-size:12px;font-weight:600;'+
        'text-decoration:underline">View event</a></div>');
    group.push([e.lat,e.lng]);
  });
  if(group.length) MAP.fitBounds(group,{padding:[40,40],maxZoom:12});
}

/* Single-marker map on the event page. Same provider as the main
   map so there is one map implementation to swap, not two. */
let EVMAP=null;
function initEventMap(){
  const el=document.getElementById('evmap');
  if(!el) return;
  if(typeof L==='undefined'){
    el.innerHTML='<div class="empty" style="height:100%;display:grid;place-content:center">'+
      '<p class="body">Map unavailable offline</p></div>';
    return;
  }
  if(EVMAP){ EVMAP.remove(); EVMAP=null; }
  const lat=+el.dataset.lat, lng=+el.dataset.lng;
  EVMAP=L.map(el,{scrollWheelZoom:false,zoomControl:true}).setView([lat,lng],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:18, attribution:'&copy; OpenStreetMap contributors'
  }).addTo(EVMAP);
  L.marker([lat,lng],{icon:L.divIcon({
    html:'<div class="pin"><b>&#9678;</b></div>', className:'',
    iconSize:[34,34], iconAnchor:[17,34]}),
    title:el.dataset.label}).addTo(EVMAP);
}

/* Real geolocation, with a graceful decline path. Never blocks
   the page: the default centre is already useful. */
function locate(){
  if(!navigator.geolocation){ toast('Location not supported'); return; }
  toast('Finding you\u2026');
  navigator.geolocation.getCurrentPosition(
    pos=>{
      GEO.here={lat:pos.coords.latitude,lng:pos.coords.longitude,label:'your location',exact:true};
      toast('Using your location');
      route();
    },
    ()=>toast('Location declined \u2014 showing Dubai'),
    {timeout:8000, maximumAge:300000}
  );
}

/* ============================================================
   SHARE SHEET — real intent URLs, new tab. Copy uses the async
   clipboard API with a select() fallback for insecure contexts.
   ============================================================ */
const SHEET={
  url:'', title:'',
  open(title,url){
    this.title=title; this.url=url;
    document.getElementById('sheet-sub').textContent='Send \u201c'+title+'\u201d to someone';
    document.getElementById('sheet-url').value=url;
    const el=document.getElementById('sheet');
    el.dataset.open='true';
    el.querySelector('.share-btn').focus();
    document.body.style.overflow='hidden';
  },
  close(){
    document.getElementById('sheet').dataset.open='false';
    document.body.style.overflow='';
  },
  send(kind){
    const t=encodeURIComponent(this.title+' \u2014 on KREO');
    const u=encodeURIComponent(this.url);
    const map={
      whatsapp:'https://wa.me/?text='+t+'%20'+u,
      telegram:'https://t.me/share/url?url='+u+'&text='+t,
      x:'https://twitter.com/intent/tweet?text='+t+'&url='+u,
      facebook:'https://www.facebook.com/sharer/sharer.php?u='+u
    };
    if(kind==='copy'){
      const box=document.getElementById('sheet-url');
      if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(this.url).then(()=>toast('Link copied'),()=>toast('Copy failed'));
      } else { box.select(); try{document.execCommand('copy');toast('Link copied');}catch(e){toast('Copy failed');} }
      this.close(); return;
    }
    window.open(map[kind],'_blank','noopener');
    this.close();
  }
};
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  const sh=document.getElementById('sheet');
  if(sh && sh.dataset.open==='true'){ SHEET.close(); return; }
  const pnl=document.getElementById('pickpanel');
  if(pnl && pnl.dataset.open==='true'){ pnl.dataset.open='false';
    const b=document.getElementById('pickbtn'); if(b) b.setAttribute('aria-expanded','false'); }
});

/* ============================================================
   THEME
   Order of authority: what the person chose > what their OS says.
   Persistence is best-effort — if storage is blocked the toggle
   still works for the session rather than throwing.
   ============================================================ */
const THEME = {
  read(){ try{ return localStorage.getItem('kreo-theme'); }catch(e){ return null; } },
  write(v){ try{ localStorage.setItem('kreo-theme',v); }catch(e){} },
  system(){ return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; },
  apply(v){
    document.documentElement.dataset.theme = v;
    const dark = v === 'dark';
    const btn = document.getElementById('theme');
    btn.innerHTML = dark ? '&#9788;' : '&#9789;';           /* sun / moon */
    btn.setAttribute('aria-pressed', String(dark));
    btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    document.querySelector('meta[name=theme-color]')
      .setAttribute('content', dark ? '#0D0C0B' : '#FAF8F4');
  },
  toggle(){
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    this.write(next); this.apply(next);
    toast(next === 'dark' ? 'Dark mode' : 'Light mode');
  },
  init(){
    this.apply(this.read() || this.system());
    /* follow the OS only while the person has never chosen */
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      if(!this.read()) this.apply(e.matches ? 'dark' : 'light');
    });
    document.getElementById('theme').addEventListener('click', () => this.toggle());
  }
};
THEME.init();

window.addEventListener('hashchange',route);
route();
