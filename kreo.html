<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KREO — Where next?</title>
<meta name="theme-color" content="#FAF8F4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ============================================================
   QUEST — tokens
   Palette + type taken from the brief's colour scheme board.
   Orange is a signal colour: graphics and large type only.
   ============================================================ */
:root{
  --ink:#0F0E0C; --ink-2:#2A2723; --paper:#FAF8F4; --surface:#FFF;
  --line:#E4DFD5; --grey:#6B665E; --grey-2:#8E8880;
  --brand:#6D28D9;      /* 6.70 on paper · white label 7.10 — fills AND text */
  --brand-ink:#5B21B6;  /* 8.47 — small text, extra headroom */
  --brand-soft:#F1EBFF; --live:#E01B00; --good:#0E7A4F;

  --f:'Archivo',system-ui,-apple-system,sans-serif;
  --m:'IBM Plex Mono',ui-monospace,monospace;

  --t-2xs:11px; --t-xs:12px; --t-sm:14px; --t-base:16px;
  --t-lg:19px; --t-xl:23px; --t-2xl:30px; --t-3xl:42px; --t-4xl:56px;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --s6:32px; --s7:48px; --s8:64px;

  --r1:6px; --r2:14px; --r3:20px; --pill:999px;
  --sh:0 1px 2px rgba(15,14,12,.05),0 10px 30px -18px rgba(15,14,12,.25);
  --scrim:rgba(250,248,244,.88);   /* sticky bars */
  --scrim-2:rgba(255,255,255,.94);
  --on-media:#FAF8F4;              /* text over photos — never flips */
  --ok-bg:#F2FAF6;
  --ez:cubic-bezier(.2,.7,.3,1);
  --tabh:76px;
}

/* Dark. ink/paper are a *pair* — flipping both keeps every
   ink-on-paper component correct without touching a component.
   brand-ink lightens: it is the readable-brand role, not a hue. */
[data-theme=dark]{
  --ink:#F4F1EB; --ink-2:#DCD6CB; --paper:#0D0C0B; --surface:#171614;
  --line:#2E2B26; --grey:#9C968C; --grey-2:#8E887C;
  --brand:#7C3AED; --brand-ink:#A78BFA; --brand-soft:#241640;
  --live:#FF4B33; --good:#3FBF87;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8);
  --scrim:rgba(13,12,11,.85); --scrim-2:rgba(23,22,20,.94);
  --ok-bg:#12241B;
}
[data-theme=dark] .story__img,[data-theme=dark] .face{border-color:var(--surface)}
[data-theme=dark] .btn[data-v=primary]:hover{background:#8B5CF6}
[data-theme=dark] img{filter:brightness(.94)}
[data-theme=dark] .qr,[data-theme=dark] .qr i{filter:none}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f);font-size:var(--t-base);line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
:where(a,button,input,select,textarea,[tabindex]):focus-visible{
  outline:2px solid var(--brand);outline-offset:2px;border-radius:var(--r1)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* --- type ---------------------------------------------------- */
.d1{font-size:var(--t-4xl);font-weight:800;line-height:.92;letter-spacing:-.045em;margin:0}
.d2{font-size:var(--t-3xl);font-weight:800;line-height:.96;letter-spacing:-.04em;margin:0}
.h1{font-size:var(--t-2xl);font-weight:800;line-height:1.05;letter-spacing:-.035em;margin:0}
.h2{font-size:var(--t-xl);font-weight:700;line-height:1.15;letter-spacing:-.03em;margin:0}
.h3{font-size:var(--t-lg);font-weight:700;line-height:1.2;letter-spacing:-.02em;margin:0}
.body{font-size:var(--t-base);color:var(--grey);margin:0}
.meta{font-family:var(--m);font-size:var(--t-xs);color:var(--grey);margin:0}
.eyebrow{font-family:var(--m);font-size:var(--t-2xs);text-transform:uppercase;
  letter-spacing:.14em;color:var(--grey);margin:0}
.price{font-family:var(--m);font-size:var(--t-sm);font-weight:500;color:var(--brand-ink)}
.price[data-free=true]{color:var(--grey)}
.muted{color:var(--grey)}

/* --- buttons -------------------------------------------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  padding:11px var(--s4);border:1px solid transparent;border-radius:var(--r1);
  font-size:var(--t-sm);font-weight:600;cursor:pointer;
  transition:transform .12s var(--ez),background-color .15s var(--ez),color .15s var(--ez)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn[data-v=primary]{background:var(--brand);color:#fff}
.btn[data-v=primary]:hover{background:#5B21B6}
.btn[data-v=ink]{background:var(--ink);color:var(--paper)}
.btn[data-v=ink]:hover{background:var(--ink-2)}
.btn[data-v=outline]{border-color:var(--ink)}
.btn[data-v=outline]:hover{background:var(--ink);color:var(--paper)}
.btn[data-v=quiet]{color:var(--grey)}
.btn[data-v=quiet]:hover{color:var(--ink);background:var(--brand-soft)}
.btn[data-size=lg]{padding:15px var(--s5);font-size:var(--t-base);width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:var(--s2);flex-wrap:wrap}

/* --- chips / tags --------------------------------------------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px var(--s3);min-height:44px;
  border:1px solid var(--line);border-radius:var(--pill);background:var(--surface);
  font-family:var(--m);font-size:var(--t-xs);cursor:pointer;white-space:nowrap;
  transition:background-color .15s var(--ez),border-color .15s var(--ez)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.tag{display:inline-block;padding:3px 7px;font-family:var(--m);font-size:var(--t-2xs);
  text-transform:uppercase;letter-spacing:.1em;border:1px solid var(--ink);border-radius:var(--r1)}
.tag[data-t=ink]{background:var(--ink);color:var(--paper)}
.tag[data-t=brand]{background:var(--brand);color:#fff;border-color:var(--brand)}
.tag[data-t=soft]{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent}
.tag[data-t=line]{background:transparent;color:var(--grey);border-color:var(--line)}

.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--m);
  font-size:var(--t-2xs);text-transform:uppercase;letter-spacing:.12em;color:var(--live)}
.live::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--live);
  animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,27,0,.5)}
  70%{box-shadow:0 0 0 7px rgba(224,27,0,0)}100%{box-shadow:0 0 0 0 rgba(224,27,0,0)}}

/* --- avatar / mark -------------------------------------------- */
.mark{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:var(--r1);
  background:var(--ink);color:var(--paper);font-family:var(--m);font-size:var(--t-2xs)}
.mark[data-size=lg]{width:52px;height:52px;font-size:var(--t-sm);border-radius:var(--r2)}

/* --- social proof --------------------------------------------- */
.going{display:flex;align-items:center;gap:var(--s2)}
.going__stack{display:flex}
.face{width:24px;height:24px;border-radius:50%;flex:none;border:2px solid var(--surface);
  display:grid;place-items:center;background:var(--ink-2);color:var(--paper);
  font-family:var(--m);font-size:9px}
.face+.face{margin-left:-8px}
.going__n{font-family:var(--m);font-size:var(--t-xs);color:var(--grey)}
.going__n b{color:var(--ink);font-weight:600}

/* --- save ------------------------------------------------------ */
.save{position:absolute;top:var(--s3);right:var(--s3);z-index:2;width:44px;height:44px;
  display:grid;place-items:center;border-radius:50%;cursor:pointer;font-size:18px;
  background:rgba(15,14,12,.5);color:#fff;backdrop-filter:blur(8px);
  transition:transform .18s var(--ez),background-color .18s var(--ez)}
.save:hover{background:rgba(15,14,12,.78)}
.save[aria-pressed=true]{background:var(--brand)}
.save:active{transform:scale(.86)}

/* --- category tiles: label + live count (counts are information,
       circles were decoration) --------------------------------- */
.cat{display:flex;align-items:center;gap:var(--s3);flex:none;
  padding:var(--s3);width:186px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r2);cursor:pointer;text-align:left;
  transition:border-color .15s var(--ez),transform .15s var(--ez)}
.cat:hover{border-color:var(--ink);transform:translateY(-2px)}
.cat__i{width:40px;height:40px;border-radius:var(--r1);object-fit:cover;flex:none}
.cat__l{font-weight:600;font-size:var(--t-sm);line-height:1.2}
.cat__n{font-family:var(--m);font-size:var(--t-2xs);color:var(--grey)}
.cat[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft)}
.cat[aria-pressed=true] .cat__n{color:var(--brand-ink)}
.cat-grid{display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fill,minmax(186px,1fr))}
.cat-grid .cat{width:auto}

/* --- follow card (Luma's "Featured Calendars") ---------------- */
.follow{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r2)}
.follow__b{flex:1;min-width:0}
.follow__b p{margin:0}
.follow__d{font-size:var(--t-sm);color:var(--grey);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* --- city header --------------------------------------------- */
.city{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.city__i{width:64px;height:64px;border-radius:var(--r2);object-fit:cover;flex:none}

/* --- date rail  (signature) ------------------------------------ */
.rail{display:grid;grid-template-columns:92px 1fr;gap:var(--s5)}
.rail+.rail{margin-top:var(--s6)}
.rail__d{position:relative;padding-top:2px}
.rail__n{font-size:44px;font-weight:800;line-height:.85;letter-spacing:-.05em}
.rail__m,.rail__w{font-family:var(--m);font-size:var(--t-2xs);text-transform:uppercase;
  letter-spacing:.16em;color:var(--grey);margin-top:5px}
.rail__w{color:var(--brand-ink);margin-top:2px}
.rail__d[data-today=true] .rail__n{color:var(--brand-ink)}
.rail__list{display:grid;gap:var(--s3);border-left:1px solid var(--line);padding-left:var(--s5)}
@media(max-width:720px){
  .rail{grid-template-columns:1fr;gap:var(--s3)}
  .rail__d{display:flex;align-items:baseline;gap:var(--s3)}
  .rail__n{font-size:30px}.rail__m,.rail__w{margin-top:0}
  .rail__list{border-left:0;padding-left:0}
}

/* --- card ------------------------------------------------------ */
.card{position:relative;display:block;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r2);overflow:hidden;cursor:pointer;
  transition:border-color .15s var(--ez),transform .15s var(--ez),box-shadow .2s var(--ez)}
.card:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:var(--sh)}
.card:active{transform:scale(.99)}
.card__b{min-width:0}
.card__tags{display:flex;gap:6px;margin-bottom:var(--s2);flex-wrap:wrap;align-items:center}
.card__f{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s3);min-width:0}
.card__f .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card__f .price{flex:none}
.card__t{margin:0 0 var(--s1)}

.card[data-v=row]{display:grid;grid-template-columns:1fr 108px;gap:var(--s4);padding:var(--s4);align-items:start}
.card[data-v=row] .card__img{width:108px;height:108px;border-radius:var(--r1);object-fit:cover}
@media(max-width:560px){
  .card[data-v=row]{grid-template-columns:1fr 84px;gap:var(--s3);padding:var(--s3)}
  .card[data-v=row] .card__img{width:84px;height:84px}
}
.card[data-v=tile] .card__img{width:100%;aspect-ratio:4/3;object-fit:cover}
.card[data-v=tile] .card__b{padding:var(--s4)}
.card[data-v=hero]{border:0;min-height:360px;display:flex;align-items:flex-end}
.card[data-v=hero] .card__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card[data-v=hero]::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(15,14,12,.9) 0%,rgba(15,14,12,.35) 48%,transparent 78%)}
.card[data-v=hero] .card__b{position:relative;z-index:1;padding:var(--s5);color:var(--on-media);width:100%}
.card[data-v=hero] .meta,.card[data-v=hero] .going__n{color:rgba(250,248,244,.75)}
.card[data-v=hero] .h1{color:var(--on-media)}
.card[data-v=hero] .going__n b{color:var(--on-media)}
.card[data-v=hero] .face{border-color:rgba(15,14,12,.85);background:#3A352E;color:var(--on-media)}
.card[data-state=soldout] .card__img{filter:grayscale(1);opacity:.55}

/* --- forms ----------------------------------------------------- */
.field{display:grid;gap:6px;margin-bottom:var(--s4)}
.label{font-family:var(--m);font-size:var(--t-2xs);text-transform:uppercase;
  letter-spacing:.12em;color:var(--grey)}
.input{width:100%;padding:12px var(--s3);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r1);font-size:var(--t-base)}
.input:focus{border-color:var(--ink);outline:none}
.input::placeholder{color:var(--grey-2)}
textarea.input{min-height:96px;resize:vertical}
.hint{font-family:var(--m);font-size:var(--t-2xs);color:var(--grey-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
@media(max-width:520px){.two{grid-template-columns:1fr}}

.toggle{display:flex;align-items:center;gap:var(--s3);cursor:pointer;
  padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.track{width:42px;height:24px;border-radius:var(--pill);background:var(--line);
  position:relative;transition:background-color .18s var(--ez);flex:none}
.track::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;
  border-radius:50%;background:#fff;transition:transform .18s var(--ez)}
.toggle input:checked+.track{background:var(--brand)}
.toggle input:checked+.track::after{transform:translateX(18px)}
.toggle input:focus-visible+.track{outline:2px solid var(--brand);outline-offset:2px}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r1)}
.stepper button{width:46px;height:46px;font-size:19px;cursor:pointer}
.stepper button:hover{background:var(--brand-soft)}
.stepper span{min-width:44px;text-align:center;font-family:var(--m);font-weight:500}

/* --- ticket ---------------------------------------------------- */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.ticket__top{padding:var(--s5);display:grid;justify-items:center;gap:var(--s4);text-align:center}
/* QR stays light in both themes — inverted codes fail most scanners */
.qr{display:grid;padding:12px;background:#fff;border-radius:var(--r1)}
.qr i{display:block;width:6px;height:6px}
.perf{height:1px;border:0;border-top:2px dashed var(--line);margin:0;position:relative}
.perf::before,.perf::after{content:'';position:absolute;top:-11px;width:22px;height:22px;
  border-radius:50%;background:var(--paper)}
.perf::before{left:-11px}.perf::after{right:-11px}
.ticket__bot{padding:var(--s4) var(--s5);display:grid;gap:var(--s2)}
.kv{display:flex;justify-content:space-between;gap:var(--s4);font-size:var(--t-sm)}
.kv dt{color:var(--grey)}
.kv dd{margin:0;font-family:var(--m);text-align:right;min-width:0;overflow-wrap:anywhere}
.kv dt{flex:none}

/* --- misc ------------------------------------------------------ */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s5)}
.ink-panel{background:var(--ink);color:var(--paper);border-radius:var(--r2);padding:var(--s5)}
.ink-panel .meta,.ink-panel .body{color:rgba(250,248,244,.66)}
.empty{text-align:center;padding:var(--s8) var(--s5);border:1px dashed var(--line);
  border-radius:var(--r2);background:var(--surface)}
.empty__m{font-size:var(--t-3xl);font-weight:800;color:var(--brand-ink);line-height:1;letter-spacing:-.04em}
.roster{display:grid;gap:var(--s2)}
.roster__r{display:grid;grid-template-columns:36px 1fr auto;gap:var(--s3);align-items:center;
  padding:var(--s3);background:var(--surface);border:1px solid var(--line);border-radius:var(--r1)}
.roster__r[data-in=true]{border-color:var(--good);background:var(--ok-bg)}
.stat{display:grid;gap:2px}
.stat b{font-size:var(--t-2xl);font-weight:800;letter-spacing:-.03em;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:var(--s4)}
.tabs{display:flex;gap:var(--s1);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--pill);padding:var(--s1);width:fit-content}
.tabs button{padding:8px var(--s4);border-radius:var(--pill);font-size:var(--t-sm);
  font-weight:600;color:var(--grey);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--paper)}
.plan{display:grid;gap:var(--s3);padding:var(--s5);border-radius:var(--r2);
  border:1px solid var(--line);background:var(--surface)}
.plan[data-hot=true]{border-color:var(--brand);border-width:2px}
.plan ul{margin:0;padding-left:var(--s4);display:grid;gap:var(--s2);
  font-size:var(--t-sm);color:var(--grey)}
.note{background:var(--brand-soft);border-radius:var(--r1);padding:var(--s3);
  font-size:var(--t-sm);color:var(--brand-ink)}

/* --- shell ----------------------------------------------------- */
.wrap{max-width:940px;margin:0 auto;padding:0 var(--s5)}
.grid{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.stack{display:grid;gap:var(--s3)}
.scroll-x{display:flex;gap:var(--s3);overflow-x:auto;padding-bottom:var(--s2);
  scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.sec{padding:var(--s6) 0}
.sec__h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);
  margin-bottom:var(--s4);flex-wrap:wrap}
.hr{height:1px;background:var(--line);border:0;margin:var(--s6) 0}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--s4);
  justify-content:space-between;padding:var(--s3) var(--s5);
  background:var(--scrim);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-size:var(--t-xl);font-weight:800;letter-spacing:-.05em}
.top__nav{display:flex;gap:var(--s5)}
.top__nav a{font-family:var(--m);font-size:var(--t-xs);text-transform:uppercase;
  letter-spacing:.1em;color:var(--grey);padding-bottom:2px;border-bottom:1px solid transparent}
.top__nav a:hover{color:var(--ink)}
.top__nav a[aria-current=page]{color:var(--ink);border-bottom-color:var(--brand)}
@media(max-width:720px){.top__nav{display:none}}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s1);
  padding:var(--s2) var(--s3) calc(var(--s2) + env(safe-area-inset-bottom));
  background:var(--scrim-2);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tabbar a{display:grid;justify-items:center;gap:3px;padding:var(--s2) 0;border-radius:var(--r1);
  font-family:var(--m);font-size:var(--t-2xs);text-transform:uppercase;
  letter-spacing:.05em;color:var(--grey)}
.tabbar a[aria-current=page]{color:var(--brand-ink)}
.tabbar a[aria-current=page] .g{background:var(--brand);color:#fff}
.g{width:30px;height:30px;display:grid;place-items:center;border-radius:var(--r1);font-size:15px}

.bar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:25;
  display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s5);
  background:var(--scrim-2);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bar .btn{flex:none;min-width:150px}

.theme{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r1);
  border:1px solid var(--line);cursor:pointer;font-size:15px;flex:none;
  transition:background-color .15s var(--ez),border-color .15s var(--ez)}
.theme:hover{border-color:var(--ink);background:var(--brand-soft)}

.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--m);
  font-size:var(--t-xs);color:var(--grey);padding:var(--s4) var(--s2) var(--s4) 0;
  min-height:44px;cursor:pointer}
.back:hover{color:var(--ink)}

.cover{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--r2)}
@media(max-width:560px){.cover{aspect-ratio:4/3}}

/* ============================================================
   HERO — canvas is the page. The scrim is built from --paper so
   it reads correct in both themes; tiles get depth from shadow
   on light and from a rim light on dark.
   ============================================================ */
/* Full-bleed: escapes the 940px wrapper so tiles are clipped by
   the viewport edge, not by a card. That clipping is what makes
   the field read as a stage rather than a panel. */
.hero{position:relative;overflow:hidden;isolation:isolate;
  background:var(--paper);
  /* 100vw includes the scrollbar; without this guard the page
     gains a horizontal scrollbar on Windows/Linux. */
  width:100vw;margin-left:calc(50% - 50vw);max-width:100%;
  min-height:760px;display:grid;place-items:center;padding:var(--s8) var(--s5)}
.hero::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 52% 56% at 50% 48%,
    var(--paper) 0%, color-mix(in srgb, var(--paper) 88%, transparent) 44%,
    transparent 78%)}
/* color-mix fallback for older engines */
@supports not (background: color-mix(in srgb, red 50%, blue)){
  .hero::after{background:radial-gradient(ellipse 52% 56% at 50% 48%,
    var(--paper) 0%, var(--paper) 40%, transparent 78%);opacity:.94}
}
.hero__c{position:relative;z-index:2;text-align:center;max-width:640px}
.hero__mark{font-size:var(--t-lg);font-weight:800;letter-spacing:-.05em;
  color:var(--ink);margin:0 0 var(--s5)}
.hero__h{font-size:clamp(40px,7.6vw,82px);font-weight:800;line-height:.94;
  letter-spacing:-.05em;color:var(--ink);margin:0}
/* KREO's ramp: deep violet -> signal -> fuchsia */
.hero__g{background:linear-gradient(98deg,#4C1D95 0%,#7C3AED 44%,#E879F9 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme=dark] .hero__g{background:linear-gradient(98deg,#A78BFA 0%,#C084FC 44%,#F0ABFC 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero__s{color:var(--grey);font-size:var(--t-lg);
  margin:var(--s5) auto 0;max-width:34ch;line-height:1.45}
.hero__cta{display:inline-flex;background:var(--ink);color:var(--paper);
  padding:15px var(--s6);border-radius:var(--pill);font-weight:600;
  margin-top:var(--s6);transition:transform .15s var(--ez)}
.hero__cta:hover{transform:translateY(-2px)}
.hero__alt{display:inline-flex;align-items:center;gap:6px;margin-top:var(--s4);
  color:var(--grey);font-size:var(--t-sm)}
.hero__alt:hover{color:var(--ink)}

/* floating cover tiles */
.tile{position:absolute;z-index:0;left:var(--x);top:var(--y);width:var(--w);
  aspect-ratio:1;
  animation:drift var(--d) ease-in-out var(--dl) infinite alternate;
  will-change:transform}
/* depth lives on the <img>, not the box — a broken image then
   leaves nothing behind rather than an empty outlined rectangle */
.tile img{width:100%;height:100%;object-fit:cover;border-radius:18px;
  box-shadow:0 18px 40px -18px rgba(15,14,12,.45)}
[data-theme=dark] .tile img{box-shadow:0 22px 50px -20px rgba(0,0,0,.85)}
@keyframes drift{
  from{transform:translate3d(0,-11px,0) rotate(calc(var(--r) - 1.4deg))}
  to  {transform:translate3d(0, 13px,0) rotate(calc(var(--r) + 1.4deg))}
}
@media(max-width:860px){
  .hero{min-height:620px}
  .tile{width:calc(var(--w) * .66)}
  .tile img{border-radius:14px}
  .tile[data-sm=hide]{display:none}
}
@media(max-width:600px){
  .hero{min-height:520px;padding:var(--s7) var(--s4)}
  .tile{width:calc(var(--w) * .5)}
  .tile img{border-radius:11px}
  .hero::after{background:radial-gradient(ellipse 82% 48% at 50% 46%,
    var(--paper) 0%, color-mix(in srgb, var(--paper) 92%, transparent) 50%,
    transparent 84%)}
  .hero__s{font-size:var(--t-base);margin-top:var(--s4)}
  .hero__cta{margin-top:var(--s5);width:100%;justify-content:center}
}

/* ============================================================
   COMMUNITIES — icon, name, two clamped lines. No button on the
   card: the whole card is the target, follow lives on the page.
   ============================================================ */
.comm{display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fill,minmax(226px,1fr))}
.comm__c{display:grid;gap:var(--s3);align-content:start;padding:var(--s4);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);
  transition:border-color .15s var(--ez),transform .15s var(--ez)}
.comm__c:hover{border-color:var(--ink);transform:translateY(-2px)}
.comm__i{width:56px;height:56px;border-radius:var(--r2);object-fit:cover;
  border:1px solid var(--line);background:var(--brand-soft)}
.comm__t{font-size:var(--t-lg);font-weight:700;letter-spacing:-.02em;margin:0}
.comm__d{margin:0;font-size:var(--t-sm);color:var(--grey);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* --- motion ---------------------------------------------------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view{animation:rise .32s var(--ez)}
.reveal>*{animation:rise .4s var(--ez) backwards}
.reveal>*:nth-child(1){animation-delay:.02s}
.reveal>*:nth-child(2){animation-delay:.06s}
.reveal>*:nth-child(3){animation-delay:.10s}
.reveal>*:nth-child(4){animation-delay:.14s}
.reveal>*:nth-child(5){animation-delay:.18s}
.reveal>*:nth-child(6){animation-delay:.22s}

/* horizontal collection rails */
.rail-x{display:flex;gap:var(--s4);overflow-x:auto;padding:2px 2px var(--s3);
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.rail-x>*{flex:0 0 260px;scroll-snap-align:start}
@media(max-width:560px){.rail-x>*{flex:0 0 78%}}
.why{display:inline-flex;align-items:center;gap:5px;font-family:var(--m);
  font-size:var(--t-2xs);color:var(--brand-ink);margin-bottom:var(--s2)}
.why::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--brand)}

/* map */
#map{height:460px;border-radius:var(--r2);border:1px solid var(--line);z-index:1}
@media(max-width:600px){#map{height:340px}}
.leaflet-container{background:var(--paper)!important;font-family:var(--f)!important}
[data-theme=dark] .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88)}
.pin{display:grid;place-items:center;width:34px;height:34px;border-radius:50% 50% 50% 2px;
  transform:rotate(45deg);background:var(--brand);color:#fff;
  box-shadow:0 4px 12px -3px rgba(0,0,0,.5);border:2px solid var(--surface)}
.pin b{transform:rotate(-45deg);font-family:var(--m);font-size:10px}
.pin[data-free=true]{background:var(--ink)}
.pop{min-width:190px}
.pop img{width:100%;height:92px;object-fit:cover;border-radius:var(--r1);margin-bottom:var(--s2)}
.mapwrap{position:relative}
.maplegend{display:flex;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s3)}
.maplegend span{display:inline-flex;align-items:center;gap:6px;font-family:var(--m);
  font-size:var(--t-2xs);color:var(--grey)}
.dot{width:10px;height:10px;border-radius:50%}

/* Search results: three across on desktop so each card is narrow
   enough to scan as a set rather than read as a list. */
.results{display:grid;gap:var(--s4);grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.results{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.results{grid-template-columns:1fr;gap:var(--s3)}}

/* ============================================================
   TICKET TILE — square, so a wall of them scans like a shelf
   ============================================================ */
.tix{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
.tix__c{position:relative;display:grid;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r3);overflow:hidden;cursor:pointer;
  transition:border-color .15s var(--ez),transform .15s var(--ez),box-shadow .2s var(--ez)}
.tix__c:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:var(--sh)}
.tix__m{width:100%;aspect-ratio:1;object-fit:cover}
.tix__b{padding:var(--s4);display:grid;gap:var(--s1)}
.tix__d{position:absolute;top:var(--s3);left:var(--s3);z-index:2;
  background:var(--surface);border-radius:var(--r1);padding:6px 8px;text-align:center;
  box-shadow:var(--sh);min-width:46px}
.tix__d b{display:block;font-size:var(--t-lg);font-weight:800;letter-spacing:-.03em;line-height:1}
.tix__d span{font-family:var(--m);font-size:9px;letter-spacing:.1em;color:var(--grey)}
@media(max-width:600px){
  .tix{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3)}
  .tix__b{padding:var(--s3)}
}

.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:190px;z-index:40;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);
  padding:var(--s1);box-shadow:var(--sh);display:none}
.menu[data-open=true]{display:grid;animation:rise .16s var(--ez)}
.menu a,.menu button{display:block;width:100%;text-align:left;padding:10px var(--s3);
  border-radius:var(--r1);font-size:var(--t-sm);cursor:pointer;color:var(--ink)}
.menu a:hover,.menu button:hover{background:var(--brand-soft);color:var(--brand-ink)}
.menu button[data-logout]{border-top:1px solid var(--line);border-radius:0 0 var(--r1) var(--r1);
  margin-top:var(--s1);color:var(--grey)}

/* ============================================================
   MAP — Leaflet + OpenStreetMap. No API key, no billing.
   Swapping to Google later means replacing initMap() only.
   ============================================================ */
let MAP=null;
function initMap(){
  const el=document.getElementById('map');
  if(!el) return;
  if(typeof L==='undefined'){
    el.innerHTML='<div class="empty" style="height:100%;display:grid;place-content:center">'+
      '<p class="h3">Map unavailable offline</p>'+
      '<p class="body">The map library could not load. Everything else still works.</p></div>';
    return;
  }
  if(MAP){ MAP.remove(); MAP=null; }
  MAP=L.map(el,{scrollWheelZoom:false}).setView([GEO.here.lat,GEO.here.lng],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:18, attribution:'&copy; OpenStreetMap contributors'
  }).addTo(MAP);

  const group=[];
  DB.events.forEach(e=>{
    const free=e.price_cents===0;
    const icon=L.divIcon({html:'<div class="pin" data-free="'+free+'"><b>'+
      (free?'FREE':(e.price_cents/100))+'</b></div>',
      className:'', iconSize:[34,34], iconAnchor:[17,34]});
    const m=L.marker([e.lat,e.lng],{icon,title:e.title}).addTo(MAP);
    m.bindPopup('<div class="pop"><img src="'+IMG+e.cover+'?w=300&q=65" alt="">'+
      '<p style="margin:0;font-weight:700">'+esc(e.title)+'</p>'+
      '<p style="margin:2px 0 6px;font-size:12px;color:#6B665E">'+
        F.day(e.start_at).long+' \u00b7 '+F.time(e.start_at)+'</p>'+
      '<a href="#/event/'+e.id+'" style="font-size:12px;font-weight:600;'+
        'text-decoration:underline">View event</a></div>');
    group.push([e.lat,e.lng]);
  });
  if(group.length) MAP.fitBounds(group,{padding:[40,40],maxZoom:12});
}

/* Real geolocation, with a graceful decline path. Never blocks
   the page: the default centre is already useful. */
function locate(){
  if(!navigator.geolocation){ toast('Location not supported'); return; }
  toast('Finding you\u2026');
  navigator.geolocation.getCurrentPosition(
    pos=>{
      GEO.here={lat:pos.coords.latitude,lng:pos.coords.longitude,label:'your location',exact:true};
      toast('Using your location');
      route();
    },
    ()=>toast('Location declined \u2014 showing Dubai'),
    {timeout:8000, maximumAge:300000}
  );
}

/* ============================================================
   SHARE SHEET
   ============================================================ */
.sheet{position:fixed;inset:0;z-index:70;display:none;place-items:center;
  padding:var(--s4);background:rgba(15,14,12,.55);backdrop-filter:blur(4px)}
.sheet[data-open=true]{display:grid;animation:rise .2s var(--ez)}
.sheet__c{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r3);padding:var(--s5);box-shadow:var(--sh)}
.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin:var(--s4) 0}
.share-btn{display:grid;justify-items:center;gap:var(--s2);padding:var(--s3) 4px;
  border-radius:var(--r2);cursor:pointer;border:1px solid var(--line);background:var(--surface);
  transition:border-color .15s var(--ez),transform .15s var(--ez)}
.share-btn:hover{border-color:var(--ink);transform:translateY(-2px)}
.share-btn i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-style:normal;font-weight:700;font-size:15px;color:#fff}
.share-btn span{font-family:var(--m);font-size:9px;letter-spacing:.06em;color:var(--grey)}
.share-link{display:flex;gap:var(--s2);align-items:center;padding:var(--s3);
  border:1px dashed var(--line);border-radius:var(--r1)}
.share-link input{flex:1;min-width:0;border:0;background:none;font-family:var(--m);
  font-size:var(--t-xs);color:var(--grey)}

/* ============================================================
   ATTENDEE TABLE (host only)
   ============================================================ */
.att{display:grid;gap:var(--s2)}
.att__r{display:grid;grid-template-columns:36px 1fr auto auto;gap:var(--s3);align-items:center;
  padding:var(--s3);background:var(--surface);border:1px solid var(--line);border-radius:var(--r1)}
.att__r[data-in=true]{border-color:var(--good);background:var(--ok-bg)}
.att__n{margin:0;font-weight:600;font-size:var(--t-sm)}
@media(max-width:600px){
  .att__r{grid-template-columns:32px 1fr auto;row-gap:var(--s2)}
  .att__r .btn{grid-column:1/-1;width:100%}
}

/* ============================================================
   CREDITS / ANALYTICS / COMPOSER
   ============================================================ */
.credit{background:linear-gradient(135deg,var(--brand) 0%,#4C1D95 100%);
  color:#fff;border-radius:var(--r2);padding:var(--s5);display:grid;gap:var(--s2)}
.credit__n{font-size:var(--t-3xl);font-weight:800;letter-spacing:-.04em;line-height:1}
.credit__l{font-family:var(--m);font-size:var(--t-2xs);text-transform:uppercase;
  letter-spacing:.14em;color:rgba(255,255,255,.75)}
.code{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);
  border:1px dashed var(--line);border-radius:var(--r1);background:var(--surface)}
.code b{font-family:var(--m);font-size:var(--t-lg);letter-spacing:.12em;flex:1;min-width:0}

.ledger{display:grid;gap:0}
.ledger__r{display:grid;grid-template-columns:1fr auto;gap:var(--s3);
  padding:var(--s3) 0;border-bottom:1px solid var(--line);align-items:center}
.ledger__r:last-child{border-bottom:0}
.ledger__v{font-family:var(--m);font-weight:500}
.ledger__v[data-dir=in]{color:var(--good)}
.ledger__v[data-dir=out]{color:var(--grey)}

/* bar chart: pure CSS, no library, degrades to nothing if empty */
.chart{display:flex;align-items:flex-end;gap:var(--s2);height:130px;margin-top:var(--s4)}
.chart__c{flex:1;display:grid;justify-items:center;gap:var(--s2);align-content:end;height:100%}
.chart__b{width:100%;background:var(--brand-soft);border-radius:var(--r1) var(--r1) 0 0;
  border-top:3px solid var(--brand);min-height:4px;transition:height .4s var(--ez)}
.chart__l{font-family:var(--m);font-size:9px;color:var(--grey);letter-spacing:.06em}

.seg{display:flex;gap:var(--s1);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--pill);padding:3px;width:fit-content;flex-wrap:wrap}
.seg button{padding:8px var(--s3);border-radius:var(--pill);font-size:var(--t-xs);
  font-family:var(--m);color:var(--grey);cursor:pointer;min-height:38px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

.boost{border:1px solid var(--brand);background:var(--brand-soft);
  border-radius:var(--r2);padding:var(--s5);display:grid;gap:var(--s3)}

/* ============================================================
   NARROW SCREENS
   The two real constraints on a phone: horizontal room, and the
   fact that .bar + .tabbar together eat ~150px of a 667px screen.
   ============================================================ */
@media(max-width:600px){
  :root{--tabh:70px}
  .wrap{padding:0 var(--s4)}
  .sec{padding:var(--s5) 0}

  /* two columns beat one very wide one at 375px */
  .cat-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:var(--s2)}
  .cat{padding:var(--s3) var(--s2);gap:var(--s2)}
  .cat__i{width:34px;height:34px}
  .comm{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:var(--s2)}
  .comm__c{padding:var(--s3);gap:var(--s2)}
  .comm__i{width:44px;height:44px;font-size:var(--t-sm)}
  .comm__t{font-size:var(--t-base)}
  .grid{grid-template-columns:1fr}

  /* the booking bar competes with the tab bar for the same thumb
     zone — shrink it rather than let it swallow the viewport */
  .bar{padding:var(--s2) var(--s4);gap:var(--s3)}
  .bar .btn{min-width:0;flex:1;max-width:60%}
  .bar .price{font-size:var(--t-base)!important}

  .stats{grid-template-columns:1fr 1fr}
  .roster__r{grid-template-columns:32px 1fr;gap:var(--s2);row-gap:var(--s3)}
  .roster__r .btn{grid-column:1/-1;width:100%}
  .panel,.ink-panel{padding:var(--s4)}
  .empty{padding:var(--s6) var(--s4)}
  .ticket__top{padding:var(--s4)}
  .ticket__bot{padding:var(--s4)}
  .plan{padding:var(--s4)}
  .btn-row .btn{flex:1;min-width:140px}
  .top{padding:var(--s3) var(--s4);gap:var(--s3)}
  .modal,.two{gap:var(--s2)}
}

/* very small / older phones. cat-grid and comm are left alone —
   auto-fill collapses them to one column on its own once the
   track no longer fits, which is more accurate than a hard cut. */
@media(max-width:360px){
  .stats{grid-template-columns:1fr}
  .top .btn[data-v=ink]{padding:10px var(--s3);font-size:var(--t-xs)}
  .wrap{padding:0 var(--s3)}
  .bar{padding:var(--s2) var(--s3)}
}

/* phone in landscape: a 660px hero leaves no content visible */
@media(max-height:520px) and (orientation:landscape){
  .hero{min-height:380px;padding:var(--s6) var(--s4)}
  .hero__h{font-size:clamp(30px,5.4vw,44px)}
  .hero__s{margin-top:var(--s3);font-size:var(--t-base)}
  .hero__cta{margin-top:var(--s4)}
}

/* pointer-coarse: hover transforms never fire on touch, and the
   lifted state can stick after a tap. Suppress them. */
@media(hover:none){
  .card:hover,.cat:hover,.comm__c:hover,.hero__cta:hover{transform:none}
  .card:hover{border-color:var(--line)}
}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 96px);max-width:calc(100vw - 32px);transform:translateX(-50%) translateY(20px);
  z-index:60;background:var(--ink);color:var(--paper);padding:12px var(--s4);
  border-radius:var(--pill);font-size:var(--t-sm);font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .2s var(--ez),transform .2s var(--ez)}
.toast[data-on=true]{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="#/home">KREO</a>
  <nav class="top__nav" id="topnav">
    <a href="#/discover">Discover</a>
    <a href="#/mine">My events</a>
    <a href="#/dashboard" data-host>Host</a>
    <a href="#/profile" data-auth>Account</a>
    <a href="#/pricing">Pricing</a>
  </nav>
  <div style="display:flex;align-items:center;gap:var(--s2)" id="topright">
    <button class="theme" id="theme" aria-pressed="false"
      aria-label="Switch to dark mode" title="Theme">&#9789;</button>
    <a class="btn" data-v="ink" href="#/login" id="authbtn">Sign in</a>
    <div style="position:relative" id="acctwrap" data-auth>
      <button class="theme" id="acct" aria-haspopup="menu" aria-expanded="false"
        aria-label="Account menu" style="font-family:var(--m);font-size:11px">CA</button>
      <div class="menu" id="acctmenu" role="menu">
        <a role="menuitem" href="#/profile">Profile &amp; credits</a>
        <a role="menuitem" href="#/mine">My events</a>
        <a role="menuitem" href="#/dashboard" data-host>Host dashboard</a>
        <button role="menuitem" data-logout>Sign out</button>
      </div>
    </div>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<nav class="tabbar" id="tabbar">
  <a href="#/discover"><span class="g">◆</span>Home</a>
  <a href="#/search"><span class="g">◎</span>Search</a>

const F = {
  money(c,cur){ return c===0 ? 'Free' : cur+' '+(c/100).toFixed(0); },
  time(iso){ return new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',...TZ}); },
  dur(m){ return m>=60 ? (m/60)+' hr'+(m>=120?'s':'') : m+' min'; },
  day(iso){
    const d=new Date(iso);
    return {n:d.toLocaleDateString('en-GB',{day:'numeric',...TZ}),
            m:d.toLocaleDateString('en-GB',{month:'short',...TZ}),
            w:d.toLocaleDateString('en-GB',{weekday:'short',...TZ}),
            long:d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',...TZ}),
            key:d.toLocaleDateString('en-CA',TZ)};
  },
  left(e){ return e.capacity-e.booked_count; },
  state(e){ const l=F.left(e); return l<=0?'soldout':l<=5?'limited':'open'; }
};
/* Deliberately varied — a community icon that matches the brand

/* ============================================================
   DISCOVERY ENGINE
   Ranking is transparent on purpose — every collection can be
   explained to an organiser who asks why they are not in it.
   ============================================================ */
const GEO = {
  /* haversine, km */
  km(a,b,c,d){
    const R=6371, r=x=>x*Math.PI/180;
    const dLat=r(c-a), dLng=r(d-b);
    const h=Math.sin(dLat/2)**2 + Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  },
  here:{lat:25.2048,lng:55.2708,label:'Dubai',exact:false}
};

const RANK = {
  /* Trending = demand per unit of time on offer, not raw bookings.
     Otherwise big-capacity free events win permanently. */
  trending(e){
    const fill = e.booked_count / Math.max(1,e.capacity);
    const age  = Math.max(1,(Date.now()-new Date(e.created_at))/86400000);
    return (e.views/age)*0.6 + fill*800 + (e.live_now?300:0);
  },
  isNew(e){ return (Date.now()-new Date(e.created_at))/86400000 <= 7; },
  near(e){ return GEO.km(GEO.here.lat,GEO.here.lng,e.lat,e.lng); },

  /* Personal score. Interests are explicit signal, past bookings
     are behavioural, saves sit between the two. */
  personal(e){
    let sc=0;
    if(DB.me.interests.includes(e.category)) sc+=60;
    const booked=DB.bookings.map(b=>event_(b.event_id)).filter(Boolean);
    if(booked.some(b=>b.category===e.category)) sc+=45;
    if(booked.some(b=>b.brand_id===e.brand_id)) sc+=35;
    if(DB.follows.has(e.brand_id)) sc+=40;
    if(DB.saved.has(e.id)) sc+=25;
    if(e.friends) sc+=e.friends*8;
    sc += Math.max(0,25-RANK.near(e));           /* mild proximity nudge */
    return sc;
  },
  why(e){
    const r=[];
    if(DB.me.interests.includes(e.category)) r.push('matches your interests');
    const booked=DB.bookings.map(b=>event_(b.event_id)).filter(Boolean);
    if(booked.some(b=>b.category===e.category)) r.push('like something you booked');
    if(DB.follows.has(e.brand_id)) r.push('from a host you follow');
    if(e.friends) r.push(e.friends+(e.friends===1?' friend':' friends')+' going');
    if(RANK.near(e)<6) r.push('close to you');
    return r[0]||'popular in your city';
  }
};

const COLLECTIONS = {
  trending: () => [...DB.events].sort((a,b)=>RANK.trending(b)-RANK.trending(a)).slice(0,6),
  fresh:    () => DB.events.filter(RANK.isNew)
                   .sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,6),
  near:     () => [...DB.events].sort((a,b)=>RANK.near(a)-RANK.near(b)).slice(0,6),
  foryou:   () => [...DB.events].sort((a,b)=>RANK.personal(b)-RANK.personal(a)).slice(0,6)

/* deterministic pseudo-QR so a ticket always renders the same block */
function qr(seed,n=21){
  let h=0; for(const ch of seed) h=(h*31+ch.charCodeAt(0))>>>0;
  let out='';
  for(let i=0;i<n*n;i++){
    h=(h*1103515245+12345)>>>0;
    const r=Math.floor(i/n), c=i%n;
    const finder = (r<7&&c<7)||(r<7&&c>n-8)||(r>n-8&&c<7);
    const on = finder ? !((r>1&&r<5&&c>1&&c<5)||(r>1&&r<5&&c>n-6&&c<n-2)||(r>n-6&&r<n-2&&c>1&&c<5))
                        && (r===0||r===6||c===0||c===6||r===n-1||r===n-7||c===n-1||c===n-7
                            ||(r>1&&r<5&&c>1&&c<5)||(r>1&&r<5&&c>n-6&&c<n-2)||(r>n-6&&r<n-2&&c>1&&c<5))
                      : (h%100)<48;
    out += '<i style="background:'+(on?'#0F0E0C':'#fff')+'"></i>';
  }
  return '<div class="qr" style="grid-template-columns:repeat('+n+',6px)" role="img" aria-label="Check-in code">'+out+'</div>';
}

/* ============================================================

function tagsFor(e){
  const st=F.state(e), out=[];
  if(e.live_now) out.push('<span class="live">Live now</span>');
  if(st==='soldout') out.push('<span class="tag" data-t="ink">Sold out</span>');
  else if(st==='limited') out.push('<span class="tag" data-t="brand">'+F.left(e)+' left</span>');
  if(e.price_cents===0) out.push('<span class="tag" data-t="soft">Free</span>');
  return out.length?'<div class="card__tags">'+out.join('')+'</div>':'';
}

/* Attendance, Luma's compact form: a few faces then +N.
   Never renders when nobody is going — an empty card says nothing. */
function going(e){
  if(!e.booked_count) return '';
  const faces=e.faces.slice(0,3).map(i=>'<span class="face">'+esc(i)+'</span>').join('');
  const rest=e.booked_count-Math.min(3,e.faces.length);
  const over = rest>0 ? '<span class="going__n">+'+rest+'</span>' : '';
  const friends = e.friends
    ? '<span class="going__n"><b>'+e.friends+' '+(e.friends===1?'friend':'friends')+'</b> going</span>'
    : '';
  return '<div class="going"><div class="going__stack">'+faces+'</div>'+over+friends+'</div>';
}

function saveBtn(id){
  const on=DB.saved.has(id);
  return '<button class="save" data-save="'+id+'" aria-pressed="'+on+'" '+
         'aria-label="Save event">'+(on?'&#9829;':'&#9825;')+'</button>';
}

        F.dur(e.duration_min)+' &middot; '+esc(e.location_name)+'</p>'+
      going(e)+
      '<div class="card__f"><span class="mark">'+esc(b.initials)+'</span>'+
        '<span class="meta">'+esc(b.name)+'</span>'+
        '<span class="price" data-free="'+(e.price_cents===0)+'" style="margin-left:auto">'+
          F.money(e.price_cents,e.currency)+'</span></div>'+
    '</div>';
  const inner = v==='row' ? body+img : img+saveBtn(e.id)+body;
  return '<a class="card" data-v="'+v+'" data-state="'+st+'" href="#/event/'+e.id+'">'+inner+'</a>';
}

function railFor(list){
  const groups={};
  [...list].sort((a,b)=>a.start_at.localeCompare(b.start_at))
    .forEach(e=>{ const k=F.day(e.start_at).key; (groups[k]||=[]).push(e); });
  if(!Object.keys(groups).length) return emptyState();
  return Object.entries(groups).map(([k,items])=>{
    const d=F.day(items[0].start_at);
    return '<section class="rail"><div class="rail__d" data-today="'+(k===TODAY)+'">'+
      '<div class="rail__n">'+d.n+'</div><div class="rail__m">'+d.m+'</div>'+
      '<div class="rail__w">'+(k===TODAY?'Today':d.w)+'</div></div>'+
      '<div class="rail__list reveal">'+items.map(e=>card(e,'row')).join('')+'</div></section>';
  }).join('');
}

function emptyState(msg,cta){
  return '<div class="empty"><p class="empty__m">&mdash;</p>'+
    '<p class="h3" style="margin:var(--s3) 0 var(--s1)">'+(msg||'Nothing here yet')+'</p>'+
    '<p class="body" style="margin-bottom:var(--s4)">'+(cta||'Try another category, or widen the date range.')+'</p>'+

}

/* ============================================================
   ROUTER
   ============================================================ */
/* Route guards. Host screens fall back to the gate (which sells
   hosting) rather than a 403; attendee screens fall back to login. */
const HOST_ONLY = ['dashboard','analytics','reach','attendees','create'];
const AUTH_ONLY = ['mine','ticket','profile','book'];

function route(){
  const raw=(location.hash||'#/home').slice(2);
  const [name,arg]=raw.split('/');
  let fn=views[name]||views.home, shown=name;

  if(HOST_ONLY.includes(name) && DB.session.role!=='host'){ fn=views.gate; shown='gate'; }
  else if(AUTH_ONLY.includes(name) && !DB.session.authed){ fn=views.login; shown='login'; }

  app().innerHTML = fn(arg);
  window.scrollTo(0,0);
  mark(shown);
  applyRole();
  if(shown==='search') wireSearch();
  if(shown==='map') setTimeout(initMap,0);
}

/* Nav reflects the session. "Host an event" is never hidden —
   hiding it would close the only door a new organiser can find. */
function applyRole(){
  const {authed, role} = DB.session;
  document.querySelectorAll('[data-auth]').forEach(el=>{
    el.style.display = authed ? '' : 'none';
  });
  document.querySelectorAll('[data-host]').forEach(el=>{
    el.style.display = role==='host' ? '' : 'none';
  });
  const btn=document.getElementById('authbtn');
  const acct=document.getElementById('acct');
  if(acct) acct.textContent = DB.me.initials;
  if(!btn) return;
  /* signed out: one clear entry. signed in: the CTA becomes the
     next useful action and identity moves into the avatar menu. */
  btn.style.display = authed ? '' : '';
  if(role==='host'){ btn.textContent='Create event'; btn.setAttribute('href','#/create'); }
  else if(authed){  btn.textContent='Host an event'; btn.setAttribute('href','#/gate'); }
  else {            btn.textContent='Sign in';       btn.setAttribute('href','#/login'); }
}

function mark(name){
  document.querySelectorAll('#topnav a, #tabbar a').forEach(a=>{
    const target=a.getAttribute('href').slice(2).split('/')[0];
    const on = target===name
      || (target==='discover' && ['event','brand','book','home'].includes(name))
      || (target==='mine' && name==='ticket')
      || (target==='dashboard' && ['analytics','reach'].includes(name))
      || (target==='profile' && name==='profile');
    on ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current');
  });
}

function runSearch(){
  const out=document.getElementById('results');
  if(!out) return;
  const val = id => { const el=document.getElementById(id); return el?el.value:''; };
  const seg = sel => {
    const b=document.querySelector(sel+' button[aria-pressed="true"]');
    if(!b) return 0;
    return parseInt(b.dataset.cost ?? b.dataset.avail ?? 0,10);
  };

  const q=(val('q')||'').trim().toLowerCase();
  const city=val('f-city'), cat=val('f-cat');
  const from=val('f-from'), to=val('f-to');
  const cost=seg('#cost'), avail=seg('#avail');

  const hits=DB.events.filter(e=>{
    const b=brand(e.brand_id);
    /* full-text across every field a person might type */
    if(q){
      const hay=(e.title+' '+b.name+' '+e.location_name+' '+e.address+' '+
                 e.category+' '+e.tags.join(' ')+' '+e.about).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(city && e.city!==city) return false;
    if(cat && e.category!==cat) return false;

    const day=F.day(e.start_at).key;
    if(from && day<from) return false;
    if(to   && day>to)   return false;

    if(cost===1 && e.price_cents!==0) return false;
    if(cost===2 && !(e.price_cents>0 && e.price_cents<15000)) return false;
    if(cost===3 && e.price_cents<15000) return false;

    const st=F.state(e);
    if(avail===1 && st==='soldout') return false;
    if(avail===2 && st!=='limited') return false;
    if(avail===3 && st!=='soldout') return false;
    return true;
  });

  const n=document.getElementById('rcount');
  if(n) n.textContent = hits.length+' event'+(hits.length===1?'':'s');
  out.className = hits.length ? 'results reveal' : '';
  out.innerHTML = hits.length ? hits.map(e=>card(e,'tile')).join('')
    : emptyState('Nothing matches those filters','Clear a filter or widen the date range.');
}

function wireSearch(){
  ['q','f-city','f-cat','f-from','f-to'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.addEventListener(id==='q'?'input':'change',runSearch);
  });
}

/* ============================================================
   DELEGATED EVENTS — one listener, survives every re-render
   ============================================================ */
document.addEventListener('click',ev=>{

  const back=ev.target.closest('[data-back]');
  if(back){ history.back(); return; }

  const save=ev.target.closest('[data-save]');
  if(save){
    ev.preventDefault(); ev.stopPropagation();
    const id=save.dataset.save, on=DB.saved.has(id);
    on ? DB.saved.delete(id) : DB.saved.add(id);
    save.setAttribute('aria-pressed',String(!on));
    save.innerHTML = on ? '&#9825;' : '&#9829;';
    toast(on?'Removed from saved':'Saved');
    return;
  }

  const cat=ev.target.closest('[data-cat]');
  if(cat){ filter=cat.dataset.cat; route(); return; }

  const qty=ev.target.closest('[data-qty]');
  if(qty){
    const el=document.getElementById('qty');
    const e=event_(location.hash.split('/')[2]);
    let n=parseInt(el.textContent,10)+parseInt(qty.dataset.qty,10);
    n=Math.max(1,Math.min(10,Math.min(n,F.left(e))));
    el.textContent=n;
    const line=document.getElementById('sum-line');
    if(line) line.textContent=F.money(e.price_cents,e.currency)+' \u00d7 '+n;
    const total=F.money(e.price_cents*n,e.currency);
    const st=document.getElementById('sum-total'), bt=document.getElementById('bar-total');
    if(st) st.textContent=total;
    if(bt) bt.textContent=total;
    return;
  }

  const confirm=ev.target.closest('[data-confirm]');
  if(confirm){
    const e=event_(confirm.dataset.confirm);
    const n=parseInt(document.getElementById('qty').textContent,10);
    const id='bk_'+Math.random().toString(36).slice(2,6).toUpperCase();
    DB.bookings.push({id,event_id:e.id,qty:n,status:'confirmed',created_at:new Date().toISOString()});
    e.booked_count=Math.min(e.capacity,e.booked_count+n);
    toast('Seat confirmed');
    location.hash='#/ticket/'+id;
    return;
  }

  const can=ev.target.closest('[data-cancel]');
  if(can){
    const id=can.dataset.cancel;
    const i=DB.bookings.findIndex(b=>b.id===id);
    if(i>-1){
      const bk=DB.bookings[i], e=event_(bk.event_id);
      e.booked_count=Math.max(0,e.booked_count-bk.qty);
      DB.bookings.splice(i,1);
      toast('Booking cancelled \u2014 seat released');
      location.hash='#/mine';
    }
    return;
  }

  const loc=ev.target.closest('[data-locate]');
  if(loc){ locate(); return; }

  const clr=ev.target.closest('[data-clear]');
  if(clr){
    ['q','f-city','f-cat','f-from','f-to'].forEach(id=>{
      const el=document.getElementById(id); if(el) el.value='';
    });
    document.querySelectorAll('#cost button, #avail button').forEach((b,i)=>
      b.setAttribute('aria-pressed', String(b.dataset.cost==='0'||b.dataset.avail==='0')));
    runSearch();
    return;
  }

  const am=ev.target.closest('#acct');
  if(am){
    const m=document.getElementById('acctmenu');
    const open=m.dataset.open!=='true';
    m.dataset.open=String(open);
    am.setAttribute('aria-expanded',String(open));
    return;
  }
  if(!ev.target.closest('#acctmenu')){
    const m=document.getElementById('acctmenu');
    if(m && m.dataset.open==='true'){ m.dataset.open='false';
      document.getElementById('acct').setAttribute('aria-expanded','false'); }
  }

  const lg=ev.target.closest('[data-login]');
  if(lg){
    const r=lg.dataset.login;
    DB.session={authed:true, role:r, brand_id: r==='host'?'b4':null};
    toast(r==='host'?'Signed in as Studio Quoz':'Signed in');
    location.hash = r==='host' ? '#/dashboard' : '#/discover';
    applyRole();
    return;
  }

  const so=ev.target.closest('[data-logout]');
  if(so){
    const m=document.getElementById('acctmenu'); if(m) m.dataset.open='false';
    DB.session={authed:false, role:'guest', brand_id:null};
    toast('Signed out');
    location.hash='#/home'; route();
    return;
  }

  /* share sheet */
  const sh=ev.target.closest('[data-open-share]');
  if(sh){
    ev.preventDefault();
    const e=event_(sh.dataset.openShare);
    SHEET.open(e ? e.title : 'KREO', 'https://kreo.ae/e/'+(e?e.id:''));
    return;
  }
  const sc=ev.target.closest('[data-sheet=close]');
  if(sc || ev.target.id==='sheet'){ SHEET.close(); return; }
  const sb=ev.target.closest('[data-share]');
  if(sb){ SHEET.send(sb.dataset.share); return; }

  const w=ev.target.closest('[data-wait]');
  if(w){
    const id=w.dataset.wait, on=DB.waitlist.has(id);
    on?DB.waitlist.delete(id):DB.waitlist.add(id);
    w.textContent = on?'Join waitlist':'On the waitlist';
    w.dataset.v = on?'ink':'quiet';
    toast(on?'Left the waitlist':'On the waitlist \u2014 we\u2019ll tell you if a seat opens');
    return;
  }

  const intr=ev.target.closest('[data-interest]');
  if(intr){
    const k=intr.dataset.interest, i=DB.me.interests.indexOf(k);
    i>-1?DB.me.interests.splice(i,1):DB.me.interests.push(k);
    intr.setAttribute('aria-pressed',String(i===-1));
    toast(i>-1?'Removed':'Added to your interests');
    return;
  }

  /* generic segmented control: one pressed per group */
  const seg=ev.target.closest('.seg button');
  if(seg){
    seg.parentElement.querySelectorAll('button')
      .forEach(x=>x.setAttribute('aria-pressed',String(x===seg)));
    if(seg.dataset.cost!==undefined||seg.dataset.avail!==undefined) runSearch();
    return;
  }

  const chk=ev.target.closest('[data-checkin]');
  if(chk){
    const row=chk.closest('.att__r')||chk.closest('.roster__r');
    if(row && row.classList.contains('att__r')){
      const eid=location.hash.split('/')[2];
      const list=DB.attendees[eid]; const a=list&&list[+chk.dataset.checkin];
      if(a) a.in=!a.in;
    }
    const on=row.dataset.in==='true';
    row.dataset.in=String(!on);
    chk.textContent = on ? 'Check in' : 'Checked in';
    chk.dataset.v  = on ? 'ink' : 'quiet';
    toast(on?'Check-in undone':'Checked in');
    return;
  }

  const fol=ev.target.closest('[data-follow]');
  if(fol){
    const id=fol.dataset.follow, on=DB.follows.has(id);
    on ? DB.follows.delete(id) : DB.follows.add(id);
    const city = id==='city';
    fol.textContent = on ? (city?'Subscribe':'Follow') : (city?'Subscribed':'Following');
    fol.dataset.v  = on ? (city?'primary':'outline') : 'quiet';
    toast(on ? 'Unsubscribed' : (city?'Subscribed to Dubai':'Following'));
    return;
  }

  const t=ev.target.closest('[data-toast]');
  if(t){ toast(t.dataset.toast); return; }
});

/* ============================================================
   MAP — Leaflet + OpenStreetMap. No API key, no billing.
   Swapping to Google later means replacing initMap() only.
   ============================================================ */
let MAP=null;
function initMap(){
  const el=document.getElementById('map');
  if(!el) return;
  if(typeof L==='undefined'){
    el.innerHTML='<div class="empty" style="height:100%;display:grid;place-content:center">'+
      '<p class="h3">Map unavailable offline</p>'+
      '<p class="body">The map library could not load. Everything else still works.</p></div>';
    return;
  }
  if(MAP){ MAP.remove(); MAP=null; }
  MAP=L.map(el,{scrollWheelZoom:false}).setView([GEO.here.lat,GEO.here.lng],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:18, attribution:'&copy; OpenStreetMap contributors'
  }).addTo(MAP);

  const group=[];
  DB.events.forEach(e=>{
    const free=e.price_cents===0;
    const icon=L.divIcon({html:'<div class="pin" data-free="'+free+'"><b>'+
      (free?'FREE':(e.price_cents/100))+'</b></div>',
      className:'', iconSize:[34,34], iconAnchor:[17,34]});
    const m=L.marker([e.lat,e.lng],{icon,title:e.title}).addTo(MAP);
    m.bindPopup('<div class="pop"><img src="'+IMG+e.cover+'?w=300&q=65" alt="">'+
      '<p style="margin:0;font-weight:700">'+esc(e.title)+'</p>'+
      '<p style="margin:2px 0 6px;font-size:12px;color:#6B665E">'+
        F.day(e.start_at).long+' \u00b7 '+F.time(e.start_at)+'</p>'+
      '<a href="#/event/'+e.id+'" style="font-size:12px;font-weight:600;'+
        'text-decoration:underline">View event</a></div>');
    group.push([e.lat,e.lng]);
  });
  if(group.length) MAP.fitBounds(group,{padding:[40,40],maxZoom:12});
}

/* Real geolocation, with a graceful decline path. Never blocks
   the page: the default centre is already useful. */
function locate(){
  if(!navigator.geolocation){ toast('Location not supported'); return; }
  toast('Finding you\u2026');
  navigator.geolocation.getCurrentPosition(
    pos=>{
      GEO.here={lat:pos.coords.latitude,lng:pos.coords.longitude,label:'your location',exact:true};
      toast('Using your location');
      route();
    },
    ()=>toast('Location declined \u2014 showing Dubai'),
    {timeout:8000, maximumAge:300000}
  );
}

/* ============================================================
   SHARE SHEET — real intent URLs, new tab. Copy uses the async
   clipboard API with a select() fallback for insecure contexts.
   ============================================================ */
const SHEET={
  url:'', title:'',
  open(title,url){
    this.title=title; this.url=url;
    document.getElementById('sheet-sub').textContent='Send \u201c'+title+'\u201d to someone';
    document.getElementById('sheet-url').value=url;
    const el=document.getElementById('sheet');
    el.dataset.open='true';
    el.querySelector('.share-btn').focus();
    document.body.style.overflow='hidden';
  },
  close(){
    document.getElementById('sheet').dataset.open='false';
    document.body.style.overflow='';
  },
  send(kind){
    const t=encodeURIComponent(this.title+' \u2014 on KREO');
    const u=encodeURIComponent(this.url);
    const map={
      whatsapp:'https://wa.me/?text='+t+'%20'+u,
      telegram:'https://t.me/share/url?url='+u+'&text='+t,
      x:'https://twitter.com/intent/tweet?text='+t+'&url='+u,
      facebook:'https://www.facebook.com/sharer/sharer.php?u='+u
    };
    if(kind==='copy'){
      const box=document.getElementById('sheet-url');
      if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(this.url).then(()=>toast('Link copied'),()=>toast('Copy failed'));
      } else { box.select(); try{document.execCommand('copy');toast('Link copied');}catch(e){toast('Copy failed');} }
      this.close(); return;
    }
    window.open(map[kind],'_blank','noopener');
    this.close();
  }
};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && document.getElementById('sheet').dataset.open==='true') SHEET.close();
});

/* ============================================================
   THEME
   Order of authority: what the person chose > what their OS says.
   Persistence is best-effort — if storage is blocked the toggle
   still works for the session rather than throwing.
   ============================================================ */
const THEME = {
  read(){ try{ return localStorage.getItem('kreo-theme'); }catch(e){ return null; } },
  write(v){ try{ localStorage.setItem('kreo-theme',v); }catch(e){} },
  system(){ return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; },
  apply(v){
    document.documentElement.dataset.theme = v;
    const dark = v === 'dark';
    const btn = document.getElementById('theme');
    btn.innerHTML = dark ? '&#9788;' : '&#9789;';           /* sun / moon */
    btn.setAttribute('aria-pressed', String(dark));
    btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    document.querySelector('meta[name=theme-color]')
      .setAttribute('content', dark ? '#0D0C0B' : '#FAF8F4');
  },
  toggle(){
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    this.write(next); this.apply(next);
    toast(next === 'dark' ? 'Dark mode' : 'Light mode');
  },
  init(){
    this.apply(this.read() || this.system());
    /* follow the OS only while the person has never chosen */
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      if(!this.read()) this.apply(e.matches ? 'dark' : 'light');
    });
    document.getElementById('theme').addEventListener('click', () => this.toggle());
  }
};
THEME.init();

window.addEventListener('hashchange',route);
route();
